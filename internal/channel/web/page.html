  function finishAppendedMessage(wasAtBottom, forceScroll) {
    if (wasAtBottom || forceScroll) scrollBottom();
    else newMessagesButton.hidden = false;
  }

  function renderText(node, text) {
    function renderLiteral(node, text) {
      node.textContent = String(text);
      node.classList.add('literal');
    }

    try {
      node.textContent = '';
      node.classList.remove('literal');
      const lines = String(text).split('\n');
      let index = 0;

    function appendLink(parent, label, href) {
      const separator = href.indexOf(':');
      const scheme = separator < 0 ? '' : href.slice(0, separator + 1).toLowerCase();
      const allowedSchemes = ['http:', 'https:', 'mailto:', 'tel:'];
      if (!allowedSchemes.includes(scheme)) return false;
      const link = document.createElement('a');
      link.setAttribute('href', href);
      link.setAttribute('rel', 'noopener noreferrer');
      link.setAttribute('target', '_blank');
      link.textContent = label;
      parent.append(link);
      return true;
    }

    function appendInline(parent, source) {
      const pattern = /(`[^`\n]+`|\[[^\]\n]+\]\([^\s)]+\)|https?:\/\/[^\s<]+|\|\|[^|\n]+\|\||\*\*[^*\n]+\*\*|(?<![A-Za-z0-9])__[^_\n]+__(?![A-Za-z0-9])|~~[^~\n]+~~|\*[^*\n]+\*|(?<![A-Za-z0-9])_[^_\n]+_(?![A-Za-z0-9]))/gi;
      let offset = 0;
      for (const match of source.matchAll(pattern)) {
        if (match.index > offset) parent.append(document.createTextNode(source.slice(offset, match.index)));
        const token = match[0];
        const markdownLink = token.match(/^\[([^\]\n]+)\]\(([^\s)]+)\)$/);
        if (token.startsWith('`')) {
          const code = document.createElement('code');
          code.textContent = token.slice(1, -1);
          parent.append(code);
        } else if (markdownLink) {
          if (!appendLink(parent, markdownLink[1], markdownLink[2])) parent.append(document.createTextNode(token));
        } else if (/^https?:\/\//i.test(token)) {
          let href = token;
          let suffix = '';
          while (/[.,!?;:)]$/.test(href)) {
            suffix = href.slice(-1) + suffix;
            href = href.slice(0, -1);
          }
          appendLink(parent, href, href);
          if (suffix) parent.append(document.createTextNode(suffix));
        } else if (token.startsWith('||')) {
          const spoiler = document.createElement('span');
          spoiler.className = 'spoiler';
          spoiler.setAttribute('tabindex', '0');
          spoiler.setAttribute('role', 'button');
          spoiler.setAttribute('aria-label', 'spoiler');
          spoiler.textContent = token.slice(2, -2);
          const reveal = () => { spoiler.classList.add('revealed'); };
          spoiler.addEventListener('click', reveal);
          spoiler.addEventListener('keydown', event => {
            if (event.key !== 'Enter' && event.key !== ' ') return;
            event.preventDefault();
            reveal();
          });
          parent.append(spoiler);
        } else {
          const element = document.createElement(token.startsWith('**') || token.startsWith('__') ? 'strong' : token.startsWith('~~') ? 's' : 'em');
          appendInline(element, token.slice(token.startsWith('**') || token.startsWith('__') || token.startsWith('~~') ? 2 : 1, token.startsWith('**') || token.startsWith('__') || token.startsWith('~~') ? -2 : -1));
          parent.append(element);
        }
        offset = match.index + token.length;
      }
      if (offset < source.length) parent.append(document.createTextNode(source.slice(offset)));
    }

    function appendLines(parent, blockLines) {
      blockLines.forEach((line, lineIndex) => {
        if (lineIndex) parent.append(document.createElement('br'));
        appendInline(parent, line);
      });
    }

    function tableCells(line) {
      const value = line.trim();
      const cells = [];
      let cell = '';
      let hasSeparator = false;
      let trailingSeparator = false;
      for (let cellIndex = 0; cellIndex < value.length; cellIndex += 1) {
        if (value[cellIndex] === '\\' && value[cellIndex + 1] === '|') {
          cell += '|';
          cellIndex += 1;
          trailingSeparator = false;
        } else if (value[cellIndex] === '|') {
          cells.push(cell.trim());
          cell = '';
          hasSeparator = true;
          trailingSeparator = true;
        } else {
          cell += value[cellIndex];
          trailingSeparator = false;
        }
      }
      cells.push(cell.trim());
      if (!hasSeparator) return null;
      if (value.startsWith('|')) cells.shift();
      if (trailingSeparator) cells.pop();
      return cells;
    }

    function isTable(at) {
      if (at + 1 >= lines.length) return false;
      const header = tableCells(lines[at]);
      const separator = tableCells(lines[at + 1]);
      return header && separator && header.length === separator.length && separator.every(cell => /^:?-{1,}:?$/.test(cell));
    }

    function isBlockStart(at) {
      const line = lines[at];
      return /^```/.test(line) || /^#{1,6}\s+/.test(line) || /^[-*+]\s+/.test(line) || /^\d+\.\s+/.test(line) || /^>\s?/.test(line) || /^(---|\*\*\*)\s*$/.test(line) || isTable(at);
    }

    while (index < lines.length) {
      if (!lines[index].trim()) {
        index += 1;
        continue;
      }

      const fence = lines[index].match(/^```\s*([A-Za-z0-9_+-]*)\s*$/);
      if (fence) {
        index += 1;
        const codeLines = [];
        while (index < lines.length && !/^```\s*$/.test(lines[index])) {
          codeLines.push(lines[index]);
          index += 1;
        }
        if (index < lines.length) index += 1;
        const pre = document.createElement('pre');
        const code = document.createElement('code');
        code.textContent = codeLines.join('\n');
        if (fence[1]) code.setAttribute('data-language', fence[1]);
        pre.append(code);
        node.append(pre);
        continue;
      }

      if (isTable(index)) {
        const header = tableCells(lines[index]);
        index += 2;
        const wrapper = document.createElement('div');
        wrapper.className = 'table-scroll';
        const table = document.createElement('table');
        const head = document.createElement('thead');
        const headRow = document.createElement('tr');
        header.forEach(value => {
          const cell = document.createElement('th');
          appendInline(cell, value);
          headRow.append(cell);
        });
        head.append(headRow);
        table.append(head);
        const body = document.createElement('tbody');
        while (index < lines.length && lines[index].trim()) {
          const values = tableCells(lines[index]);
          if (!values) break;
          const row = document.createElement('tr');
          header.forEach((_, cellIndex) => {
            const cell = document.createElement('td');
            appendInline(cell, values[cellIndex] || '');
            row.append(cell);
          });
          body.append(row);
          index += 1;
        }
        table.append(body);
        wrapper.append(table);
        node.append(wrapper);
        continue;
      }

      const heading = lines[index].match(/^#{1,6}\s+(.+)$/);
      if (heading) {
        const paragraph = document.createElement('p');
        paragraph.className = 'heading';
        appendInline(paragraph, heading[1]);
        node.append(paragraph);
        index += 1;
        continue;
      }

      if (/^(---|\*\*\*)\s*$/.test(lines[index])) {
        node.append(document.createElement('hr'));
        index += 1;
        continue;
      }

      const bullet = lines[index].match(/^[-*+]\s+(.+)$/);
      if (bullet) {
        const list = document.createElement('ul');
        while (index < lines.length) {
          const itemMatch = lines[index].match(/^[-*+]\s+(.+)$/);
          if (!itemMatch) break;
          const item = document.createElement('li');
          appendInline(item, itemMatch[1]);
          list.append(item);
          index += 1;
        }
        node.append(list);
        continue;
      }

      const numbered = lines[index].match(/^(\d+)\.\s+(.+)$/);
      if (numbered) {
        const list = document.createElement('ol');
        list.setAttribute('start', numbered[1]);
        while (index < lines.length) {
          const itemMatch = lines[index].match(/^\d+\.\s+(.+)$/);
          if (!itemMatch) break;
          const item = document.createElement('li');
          appendInline(item, itemMatch[1]);
          list.append(item);
          index += 1;
        }
        node.append(list);
        continue;
      }

      if (/^>\s?/.test(lines[index])) {
        const quote = document.createElement('blockquote');
        const quoteLines = [];
        while (index < lines.length && /^>\s?/.test(lines[index])) {
          quoteLines.push(lines[index].replace(/^>\s?/, ''));
          index += 1;
        }
        appendLines(quote, quoteLines);
        node.append(quote);
        continue;
      }

      const paragraphLines = [];
      while (index < lines.length && lines[index].trim() && (!paragraphLines.length || !isBlockStart(index))) {
        paragraphLines.push(lines[index]);
        index += 1;
      }
      const paragraph = document.createElement('p');
      appendLines(paragraph, paragraphLines);
      node.append(paragraph);
    }
    } catch (error) {
      console.error('web: markdown render failed', error);
      renderLiteral(node, text);
    }
  }

  function renderLiteral(node, text) {
    node.textContent = String(text);
    node.classList.add('literal');
  }

  function formatDuration(seconds) {
    const whole = Math.max(0, Math.round(Number(seconds) || 0));
    return Math.floor(whole / 60) + ':' + String(whole % 60).padStart(2, '0');
  }

  function renderVoice(node, data) {
    node.textContent = '';
    node.classList.add('literal');
    const label = document.createElement('span');
    label.className = 'voice-label';
    const duration = Number(data.duration_seconds || 0);
    label.textContent = '🎤 Voice note' + (duration > 0 ? ' · ' + formatDuration(duration) : '');
    node.append(label);
    if (data.text) {
      const transcript = document.createElement('div');
      transcript.className = 'voice-transcript';
      renderVoiceTranscript(transcript, String(data.text));
      node.append(transcript);
    }
  }

  function normaliseDocumentAttachment(value) {
    if (!value || value.kind !== 'html') return null;
    const url = String(value.url || '');
    if (!/^\/files\/[0-9a-f]{32}$/.test(url)) return null;
    return {
      kind: 'html',
      url,
      name: String(value.name || 'document.html'),
      bytes: Math.max(0, Number(value.bytes || 0))
    };
  }

  function formatDocumentSize(bytes) {
    const value = Math.max(0, Number(bytes || 0));
    if (value >= 1024 * 1024) return (value / (1024 * 1024)).toFixed(value >= 10 * 1024 * 1024 ? 0 : 1) + ' MB';
    return Math.max(1, Math.ceil(value / 1024)) + ' KB';
  }

  function markDocumentExpired(card, openButton, status) {
    card.classList.add('expired');
    openButton.disabled = true;
    status.textContent = 'expired';
  }

  async function documentIsAvailable(card, openButton, status, url) {
    try {
      const response = await fetch(url, {method: 'HEAD'});
      if (response.status === 404) {
        markDocumentExpired(card, openButton, status);
        return false;
      }
      if (!response.ok) throw new Error('document unavailable');
      status.textContent = '';
      return true;
    } catch (_) {
      status.textContent = 'unavailable';
      return false;
    }
  }

  function openDocumentViewer(attachmentValue, returnFocus) {
    const attachment = normaliseDocumentAttachment(attachmentValue);
    if (!attachment) return;
    documentViewerReturnFocus = returnFocus;
    documentViewerTitle.textContent = attachment.name;
    documentViewerFrame.textContent = '';
    const frame = document.createElement('iframe');
    frame.setAttribute('title', attachment.name);
    frame.setAttribute('sandbox', 'allow-scripts');
    frame.setAttribute('referrerpolicy', 'no-referrer');
    frame.setAttribute('src', attachment.url);
    documentViewerFrame.append(frame);
    documentViewer.hidden = false;
    documentViewerClose.focus();
  }

  function closeDocumentViewer() {
    if (documentViewer.hidden) return;
    documentViewer.hidden = true;
    documentViewerFrame.textContent = '';
    const returnFocus = documentViewerReturnFocus;
    documentViewerReturnFocus = null;
    if (returnFocus && returnFocus.focus) returnFocus.focus();
  }

  function createDocumentCard(attachmentValue) {
    const attachment = normaliseDocumentAttachment(attachmentValue);
    if (!attachment) return null;
    const card = document.createElement('section');
    card.className = 'doc-card';
    const icon = document.createElement('span');
    icon.className = 'doc-icon';
    icon.setAttribute('aria-hidden', 'true');
    icon.textContent = '📄';
    const details = document.createElement('div');
    details.className = 'doc-details';
    const name = document.createElement('div');
    name.className = 'doc-name';
    name.textContent = attachment.name;
    const size = document.createElement('div');
    size.className = 'doc-size';
    size.textContent = formatDocumentSize(attachment.bytes);
    const status = document.createElement('div');
    status.className = 'doc-status';
    status.setAttribute('aria-live', 'polite');
    const actions = document.createElement('div');
    actions.className = 'doc-actions';
    const openButton = document.createElement('button');
    openButton.type = 'button';
    openButton.textContent = 'Open';
    openButton.addEventListener('click', async () => {
      if (await documentIsAvailable(card, openButton, status, attachment.url)) {
        openDocumentViewer(attachment, openButton);
      }
    });
    actions.append(openButton);
    details.append(name, size, actions, status);
    card.append(icon, details);
    return card;
  }

  function announceDocumentReceived(data) {
    const attachment = normaliseDocumentAttachment(data.attachment);
    const messageID = Number(data.message_id || 0);
    if (!attachment || data.replay || currentView !== 'drive' || announcedDocumentMessageIDs.has(messageID)) return;
    announcedDocumentMessageIDs.add(messageID);
    localNotice('document');
  }

  function transcriptFoldParts(text) {
    if (text.length <= TRANSCRIPT_FOLD_THRESHOLD) return null;
    const lines = text.replace(/\r\n?/g, '\n').split('\n');
    if (lines.length >= 4) {
      return {
        head: lines.slice(0, 2).join('\n'),
        middle: lines.slice(2, -1).join('\n'),
        tail: lines[lines.length - 1]
      };
    }
    let headEnd = text.lastIndexOf(' ', TRANSCRIPT_FOLD_LINE_CHARS * 2);
    if (headEnd < TRANSCRIPT_FOLD_LINE_CHARS) headEnd = TRANSCRIPT_FOLD_LINE_CHARS * 2;
    let tailStart = text.indexOf(' ', text.length - TRANSCRIPT_FOLD_LINE_CHARS);
    if (tailStart <= headEnd) tailStart = text.length - TRANSCRIPT_FOLD_LINE_CHARS;
    return {
      head: text.slice(0, headEnd).trimEnd(),
      middle: text.slice(headEnd, tailStart).trim(),
      tail: text.slice(tailStart).trimStart()
    };
  }

  function renderVoiceTranscript(node, text) {
    node.textContent = '';
    const parts = transcriptFoldParts(text);
    if (!parts || !parts.middle) {
      node.textContent = text;
      return;
    }
    const head = document.createElement('div');
    head.className = 'transcript-part';
    head.textContent = parts.head;
    const toggle = document.createElement('button');
    toggle.className = 'transcript-fold';
    toggle.type = 'button';
    toggle.setAttribute('aria-expanded', 'false');
    toggle.textContent = '✂ ⋯ ✂';
    const middle = document.createElement('div');
    middle.className = 'transcript-middle transcript-part';
    middle.setAttribute('aria-hidden', 'true');
    middle.textContent = parts.middle;
    const tail = document.createElement('div');
    tail.className = 'transcript-part';
    tail.textContent = parts.tail;
    toggle.addEventListener('click', () => {
      const expanding = toggle.getAttribute('aria-expanded') !== 'true';
      toggle.setAttribute('aria-expanded', String(expanding));
      middle.setAttribute('aria-hidden', String(!expanding));
      if (expanding) {
        middle.classList.add('expanded');
        middle.style.maxHeight = middle.scrollHeight + 'px';
      } else {
        middle.style.maxHeight = middle.scrollHeight + 'px';
        requestAnimationFrame(() => {
          middle.classList.remove('expanded');
          middle.style.maxHeight = '0px';
        });
      }
    });
    node.append(head, toggle, middle, tail);
  }

  function rowKey(kind, id) {
    if (kind === 'mine') return 'mine:' + id;
    if (kind === 'status') return 'status:' + id;
    return 'agent:' + id;
  }

  function addMessage(kind, data, deliveryText, options) {
    const settings = options || {};
    const wasAtBottom = isNearMessageBottom();
    const id = Number(data.message_id || 0);
    const key = rowKey(kind, id);
    if (id && rows.has(key)) return rows.get(key);
    const row = document.createElement('article');
    row.className = 'message ' + (kind === 'mine' ? 'mine' : kind === 'status' ? 'status' : 'agent');
    const body = document.createElement('div');
    body.className = 'body';
    if (kind === 'agent') renderText(body, data.text || '');
    else if (kind === 'mine' && data.voice) renderVoice(body, data);
    else renderLiteral(body, data.text || '');
    const documentAttachment = kind === 'agent' ? normaliseDocumentAttachment(data.attachment) : null;
    if (documentAttachment) body.append(createDocumentCard(documentAttachment));
    const meta = document.createElement('div');
    meta.className = 'meta';
    const timestamp = document.createElement('time');
    timestamp.textContent = new Date(data.timestamp || Date.now()).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
    meta.append(timestamp);
    if (deliveryText) {
      const delivery = document.createElement('span');
      delivery.className = 'delivery';
      delivery.textContent = deliveryText;
      meta.append(delivery);
      row.delivery = delivery;
    }
    if (kind === 'agent' && id && String(data.text || '')) meta.append(createMessageAudioButton(id));
    row.append(body, meta);
    row.bodyNode = body;
    row.metaNode = meta;
    row.replyText = String(data.text || '');
    row.attachment = documentAttachment;
    row.voiceDuration = Number(data.duration_seconds || 0);
    if (settings.before) messageList.insertBefore(row, settings.before);
    else messageList.append(row);
    if (kind === 'agent') updateDriveReply(data.text || '', id, documentAttachment);
    if (kind === 'mine' && data.voice) {
      if (!id || id >= lastTranscriptMessageID) {
        lastTranscriptMessageID = id;
        setDriveTranscript(data.text ? String(data.text) : 'Voice note' + (row.voiceDuration > 0 ? ' · ' + formatDuration(row.voiceDuration) : ''));
      }
    }
    if (id) {
      row.dataset.messageId = String(id);
      rows.set(key, row);
    }
    if (settings.history) row.dataset.historyEntry = 'true';
    if (!settings.quiet) finishAppendedMessage(wasAtBottom, settings.forceScroll);
    return row;
  }

  function rememberFreshReplay(kind, data) {
    freshReplayEvents.push({kind, data: Object.assign({}, data)});
    scheduleFreshHistoryFinish();
  }

  function scheduleFreshHistoryFinish() {
    window.clearTimeout(freshReplayTimer);
    freshReplayTimer = window.setTimeout(finishFreshHistory, HISTORY_REPLAY_SETTLE_MS);
  }

  function reconcileFreshHistory() {
    freshReplayEvents.forEach(event => {
      let kind = event.kind;
      const data = event.data;
      if (kind === 'edit') kind = data.voice ? 'mine' : 'agent';
      const id = Number(data.message_id || 0);
      const key = rowKey(kind, id);
      let entry = id ? replayHistoryByKey.get(key) : null;
      if (!entry) {
        entry = {kind, data: Object.assign({}, data)};
        replayHistoryEntries.push(entry);
        if (id) replayHistoryByKey.set(key, entry);
      } else {
        entry.data = Object.assign({}, entry.data, data);
      }
      if (kind === 'mine' && data.voice) entry.data.voice = true;
    });
  }

  function updateDriveFromFreshHistory() {
    for (let index = replayHistoryEntries.length - 1; index >= 0; index -= 1) {
      const entry = replayHistoryEntries[index];
      if (!lastReplyMessageID && entry.kind === 'agent') {
        updateDriveReply(entry.data.text || '', entry.data.message_id, entry.data.attachment);
      }
      if (!lastTranscriptText && entry.kind === 'mine' && entry.data.voice) {
        const duration = Number(entry.data.duration_seconds || 0);
        lastTranscriptMessageID = Number(entry.data.message_id || 0);
        setDriveTranscript(entry.data.text ? String(entry.data.text) : 'Voice note' + (duration > 0 ? ' · ' + formatDuration(duration) : ''));
      }
      if (lastReplyMessageID && lastTranscriptText) break;
    }
  }

  function finishFreshHistory() {
    if (!freshHistoryPending) return;
    freshHistoryPending = false;
    window.clearTimeout(freshReplayTimer);
    reconcileFreshHistory();
    updateDriveFromFreshHistory();
    replayHistoryVisibleStart = Math.max(0, replayHistoryEntries.length - HISTORY_PAGE_SIZE);
    replayHistoryEntries.slice(replayHistoryVisibleStart).forEach(entry => {
      addMessage(entry.kind, entry.data, entry.kind === 'mine' ? 'sent' : '', {quiet: true, history: true});
    });
    loadEarlierButton.hidden = replayHistoryVisibleStart === 0;
    messages.scrollTop = messages.scrollHeight;
    newMessagesButton.hidden = true;
    requestAnimationFrame(() => {
      messages.scrollTop = messages.scrollHeight;
      chatView.classList.add('history-ready');
    });
  }

  function loadEarlierHistory() {
    if (loadingEarlier || replayHistoryVisibleStart === 0) return;
    loadingEarlier = true;
    const oldHeight = messages.scrollHeight;
    const oldTop = messages.scrollTop;
    const nextStart = Math.max(0, replayHistoryVisibleStart - HISTORY_PAGE_SIZE);
    const firstVisible = messageList.querySelector('[data-history-entry="true"]');
    replayHistoryEntries.slice(nextStart, replayHistoryVisibleStart).forEach(entry => {
      addMessage(entry.kind, entry.data, entry.kind === 'mine' ? 'sent' : '', {
        quiet: true, history: true, before: firstVisible
      });
    });
    replayHistoryVisibleStart = nextStart;
    loadEarlierButton.hidden = replayHistoryVisibleStart === 0;
    messages.scrollTop = oldTop + messages.scrollHeight - oldHeight;
    loadingEarlier = false;
  }

  function updateHiddenReplayEntry(kind, data) {
    const id = Number(data.message_id || 0);
    const entry = replayHistoryByKey.get(rowKey(kind, id));
    if (!entry) return false;
    entry.data = Object.assign({}, entry.data, data);
    if (kind === 'mine' && data.voice) entry.data.voice = true;
    return true;
  }

  function setDelivery(row, text, state) {
    if (!row.delivery) return;
    row.delivery.textContent = text;
    row.delivery.className = 'delivery ' + (state || '');
  }

  function recordMessageID(row, kind, id) {
    if (!id) return;
    row.dataset.messageId = String(id);
    rows.set(rowKey(kind, id), row);
  }

  function clientID() {
    if (crypto.randomUUID) return crypto.randomUUID();
    const values = crypto.getRandomValues(new Uint32Array(4));
    return Array.from(values, value => value.toString(16)).join('-');
  }

  async function deliver(pending) {
    setDelivery(pending.row, pending.attempt ? 'not delivered — retrying' : 'sending', pending.attempt ? 'retrying' : '');
    try {
      const controller = new AbortController();
      const timeout = window.setTimeout(() => controller.abort(), 15000);
      let response;
      try {
        response = await fetch('/send', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({text: pending.text, client_id: pending.clientID}),
          signal: controller.signal
        });
      } finally {
        window.clearTimeout(timeout);
      }
      if (response.status === 202) {
        const result = await response.json();
        const id = Number(result.message_id || 0);
        recordMessageID(pending.row, 'mine', id);
        pendingRows.delete(pending.clientID);
        setDelivery(pending.row, 'sent', '');
        return;
      }
      if (response.status === 503) throw new Error('retry');
      let reason = 'request failed';
      try {
        const result = await response.json();
        if (result.error) reason = result.error;
      } catch (_) {
        if (response.status === 401) reason = 'sign in again';
      }
      pendingRows.delete(pending.clientID);
      setDelivery(pending.row, 'not sent — ' + reason, 'failed');
      return;
    } catch (_) {
      pending.attempt += 1;
      const delay = Math.min(30000, 2000 * Math.pow(2, pending.attempt - 1));
      setDelivery(pending.row, 'not delivered — retrying', 'retrying');
      window.setTimeout(() => deliver(pending), delay);
    }
  }

  function finishVoiceUpload() {
    micButton.disabled = handsFreeEnabled;
    micButton.setAttribute('aria-pressed', 'false');
    micButton.textContent = '🎤';
    handsFreeButton.disabled = handsFreeStarting;
  }

  function settleVoiceUpload(pending) {
    if (pending.settled) return false;
    pending.settled = true;
    window.clearTimeout(pending.handsFreeDeadline);
    pending.handsFreeDeadline = 0;
    return true;
  }

  function failVoiceUpload(pending, reason) {
    if (!settleVoiceUpload(pending)) return;
    if (pending.fromDraft && (!driveDraft || driveDraft.clientID === pending.fromDraft.clientID)) keepDriveDraft(pending.fromDraft, false);
    pendingRows.delete(pending.clientID);
    setDelivery(pending.row, 'not sent — ' + reason, 'failed');
    finishVoiceUpload();
    if (pending.handsFree) handsFreeUploadFailed(pending.clientID);
    if (pending.drive) {
      resetReplyTracking();
      setState(handsFreeEnabled ? 'listening' : 'idle', true);
      localNotice('error');
    }
  }

  function startHandsFreeUploadDeadline(pending) {
    if (!pending.handsFree || pending.handsFreeDeadline) return;
    pending.handsFreeDeadline = window.setTimeout(() => {
      if (pending.controller) pending.controller.abort();
      failVoiceUpload(pending, 'upload timed out');
    }, HANDS_FREE_UPLOAD_TIMEOUT_MS);
  }

  async function deliverVoice(pending) {
    if (pending.settled) return;
    startHandsFreeUploadDeadline(pending);
    setDelivery(pending.row, pending.attempt ? 'not delivered — retrying' : 'sending', pending.attempt ? 'retrying' : '');
    micButton.disabled = true;
    micButton.setAttribute('aria-pressed', 'false');
    micButton.textContent = 'uploading…';
    const controller = new AbortController();
    pending.controller = controller;
    const attemptTimeout = pending.handsFree ? 0 : window.setTimeout(() => controller.abort(), 60000);
    try {
      const response = await fetch('/voice-note', {
        method: 'POST',
        headers: {'Content-Type': pending.mimeType, 'X-Client-Id': pending.clientID},
        body: pending.blob,
        signal: controller.signal
      });
      if (response.status === 202) {
        const result = await response.json();
        if (!settleVoiceUpload(pending)) return;
        const messageID = Number(result.message_id || 0);
        recordMessageID(pending.row, 'mine', messageID);
        pendingRows.delete(pending.clientID);
        setDelivery(pending.row, 'sent', '');
        finishVoiceUpload();
        if (pending.fromDraft && (!driveDraft || driveDraft.clientID === pending.fromDraft.clientID)) {
          deleteStoredDriveDraft().catch(error => console.error('web: drive draft delete after send failed', error));
        }
        if (pending.handsFree) handsFreeUploadAccepted(pending.clientID, messageID);
        if (pending.drive) driveUploadAccepted(pending.clientID, messageID);
        return;
      }
      if (response.status === 503) throw new Error('retry');
      let reason = 'request failed';
      try {
        const result = await response.json();
        if (result.error) reason = result.error;
      } catch (_) {
        if (response.status === 401) reason = 'sign in again';
      }
      failVoiceUpload(pending, reason);
    } catch (_) {
      if (pending.settled) return;
      pending.attempt += 1;
      const delay = Math.min(30000, 2000 * Math.pow(2, pending.attempt - 1));
      setDelivery(pending.row, 'not delivered — retrying', 'retrying');
      window.setTimeout(() => deliverVoice(pending), delay);
    } finally {
      window.clearTimeout(attemptTimeout);
      if (pending.controller === controller) pending.controller = null;
    }
  }

  let recording;
  let recordingStarting = false;

  function hasUnsentWork() {
    return unsentWork({
      recording: Boolean(recording && recording.recorder.state !== 'inactive'),
      recordingStarting,
      handsFree: Boolean(handsFreeCapture),
      liveSendBeat: Boolean(liveSendBeat),
      pendingCount: pendingRows.size,
      undurableDraft: Boolean(driveDraft && !driveDraftDurable),
      draftWriteInFlight: driveDraftWriteInFlight > 0
    });
  }

  function preserveUnreleasedRecordingAsDraft(announce) {
    const notice = announce ? 'draft-saved' : '';
    if (recording && recording.recorder.state !== 'inactive') {
      if (!recording.saveAsDraft) stopRecording(false, false, notice, true);
      return true;
    }
    if (recordingStarting) {
      preserveRecordingWhenStarted = notice || 'quiet';
      return true;
    }
    return false;
  }

  function recorderMimeType() {
    const choices = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'];
    if (!MediaRecorder.isTypeSupported) return '';
    return choices.find(type => MediaRecorder.isTypeSupported(type)) || '';
  }

  function recordingMilliseconds(capture) {
    return capture ? Math.max(0, performance.now() - capture.started) : 0;
  }

  function stopRecording(discard, refuse, cancelNotice, saveAsDraft) {
    if (!recording || recording.recorder.state === 'inactive') return;
    recording.discard = Boolean(discard);
    recording.refuse = Boolean(refuse);
    recording.cancelNotice = cancelNotice || '';
    recording.saveAsDraft = Boolean(saveAsDraft);
    if (recording.source === 'drive') setDriveLocked(false);
    window.clearTimeout(recording.autoStop);
    window.clearInterval(recording.clock);
    recording.recorder.stop();
    micButton.setAttribute('aria-pressed', 'false');
    micButton.disabled = true;
    micButton.textContent = 'uploading…';
    if (recording.source === 'drive' && !recording.discard && !recording.refuse && !recording.saveAsDraft) setState('sending');
  }

  async function startRecording(source) {
    if (recordingStarting) return;
    const recordingSource = source === 'drive' ? 'drive' : 'chat';
    recordingStarting = true;
    if (recordingSource === 'drive') setState('recording');
    micButton.disabled = true;
    handsFreeButton.disabled = true;
    setVoiceStatus('');
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({audio: {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true
      }});
      const mimeType = recorderMimeType();
      const recorder = mimeType ? new MediaRecorder(stream, {mimeType}) : new MediaRecorder(stream);
      const started = performance.now();
      const capture = {recorder, stream, started, chunks: [], failed: false, source: recordingSource, discard: false, refuse: false, saveAsDraft: false};
      recording = capture;
      recorder.addEventListener('dataavailable', event => {
        if (event.data && event.data.size) capture.chunks.push(event.data);
      });
      recorder.addEventListener('stop', () => {
        if (recording === capture) recording = null;
        capture.stream.getTracks().forEach(track => track.stop());
        if (capture.failed) return;
        const milliseconds = recordingMilliseconds(capture);
        if (capture.saveAsDraft) {
          finishVoiceUpload();
          if (capture.source === 'drive') {
            setState(handsFreeEnabled ? 'listening' : 'idle', true);
            setDriveTranscript('saved as draft');
          }
          const actualType = capture.recorder.mimeType || (capture.chunks[0] && capture.chunks[0].type) || 'audio/webm';
          const blob = new Blob(capture.chunks, {type: actualType});
          if (blob.size) {
            keepDriveDraft({
              blob,
              mimeType: actualType,
              duration: milliseconds / 1000,
              clientID: clientID(),
              source: capture.source
            }, capture.cancelNotice === 'draft-saved');
          } else {
            setVoiceStatus('could not save recording draft', 4000);
            localNotice('error');
          }
          return;
        }
        if (capture.discard || capture.refuse) {
          finishVoiceUpload();
          if (capture.source === 'drive') {
            setState(handsFreeEnabled ? 'listening' : 'idle', true);
            setDriveTranscript(capture.discard ? 'cancelled' : 'send refused');
            localNotice(capture.discard ? capture.cancelNotice || 'send-cancelled' : 'send-refused');
          }
          return;
        }
        if (milliseconds < 400) {
          finishVoiceUpload();
          setVoiceStatus('too short', 3000);
          if (capture.source === 'drive') setState(handsFreeEnabled ? 'listening' : 'idle', true);
          return;
        }
        const actualType = capture.recorder.mimeType || (capture.chunks[0] && capture.chunks[0].type) || 'audio/webm';
        const blob = new Blob(capture.chunks, {type: actualType});
        const duration = milliseconds / 1000;
        const row = addMessage('mine', {
          voice: true, duration_seconds: duration, timestamp: new Date().toISOString()
        }, 'sending', {forceScroll: true});
        const id = clientID();
        pendingRows.set(id, row);
        if (capture.source === 'drive') {
          resetReplyTracking();
          awaitingClientID = id;
        }
        deliverVoice({blob, mimeType: actualType, clientID: id, row, attempt: 0, drive: capture.source === 'drive'});
      }, {once: true});
      recorder.addEventListener('error', () => {
        capture.failed = true;
        capture.stream.getTracks().forEach(track => track.stop());
        if (recording === capture) recording = null;
        finishVoiceUpload();
        setVoiceStatus('microphone recording failed', 4000);
        if (capture.source === 'drive') setState(handsFreeEnabled ? 'listening' : 'idle', true);
        if (capture.source === 'drive') setDriveLocked(false);
      }, {once: true});
      recorder.start(MEDIA_RECORDER_TIMESLICE_MS);
      recordingStarting = false;
      micButton.disabled = false;
      micButton.setAttribute('aria-pressed', 'true');
      micButton.textContent = '● 0:00';
      if (capture.source === 'drive') setState('recording');
      recording.clock = window.setInterval(() => {
        if (recording) micButton.textContent = '● ' + formatDuration((performance.now() - recording.started) / 1000);
      }, 250);
      recording.autoStop = window.setTimeout(() => stopRecording(false, capture.source === 'drive' && driveIsHeld()), 5 * 60 * 1000);
      if (preserveRecordingWhenStarted) {
        const notice = preserveRecordingWhenStarted === 'draft-saved' ? 'draft-saved' : '';
        preserveRecordingWhenStarted = '';
        window.setTimeout(() => stopRecording(false, false, notice, true), 0);
      } else if (capture.source === 'drive' && drivePendingRecordingAction) {
        const action = drivePendingRecordingAction;
        drivePendingRecordingAction = '';
        window.setTimeout(() => stopRecording(action === 'cancel-locked', action === 'refuse', action === 'cancel-locked' ? 'recording-cancelled' : ''), 0);
      }
    } catch (_) {
      if (stream) stream.getTracks().forEach(track => track.stop());
      recording = null;
      recordingStarting = false;
      finishVoiceUpload();
      setVoiceStatus('microphone unavailable — check browser permission', 5000);
      drivePendingRecordingAction = '';
      preserveRecordingWhenStarted = '';
      if (recordingSource === 'drive') setState(handsFreeEnabled ? 'listening' : 'idle', true);
      if (recordingSource === 'drive') setDriveLocked(false);
    }
  }

  micButton.addEventListener('click', () => {
    if (recording) stopRecording();
    else if (!recordingStarting) startRecording('chat');
  });

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
    micButton.hidden = true;
    handsFreeButton.hidden = true;
    setVoiceStatus('Voice notes need the HTTPS link.');
  }

  composer.addEventListener('submit', event => {
    event.preventDefault();
    const text = input.value;
    if (!text.trim()) return;
    const row = addMessage('mine', {text, timestamp: new Date().toISOString()}, 'sending', {forceScroll: true});
    const id = clientID();
    pendingRows.set(id, row);
    input.value = '';
    counter.hidden = true;
    counter.textContent = '';
    input.focus({preventScroll: true});
    scrollBottom();
    deliver({text, clientID: id, row, attempt: 0});
  });

  input.addEventListener('input', () => {
    const length = input.value.length;
    counter.hidden = length <= 15000;
    counter.textContent = length + ' / 16000';
  });

  input.addEventListener('keydown', event => {
    // Enter sends and Shift+Enter breaks the line on a physical keyboard; touch devices keep
    // Enter as a newline (no reliable Shift there) and send with the button.
    if (event.key !== 'Enter' || event.shiftKey || event.isComposing) return;
    if (window.matchMedia('(pointer: coarse)').matches) return;
    event.preventDefault();
    if (input.value.trim()) composer.requestSubmit();
  });

  function renderOwn(data) {
    const pending = pendingRows.get(data.client_id || '');
    if (pending) {
      recordMessageID(pending, 'mine', Number(data.message_id || 0));
      pendingRows.delete(data.client_id);
      if (data.voice) {
        pending.voiceDuration = Number(data.duration_seconds || pending.voiceDuration || 0);
        renderVoice(pending.bodyNode, {
          voice: true, duration_seconds: pending.voiceDuration, text: data.text || ''
        });
        lastTranscriptMessageID = Math.max(lastTranscriptMessageID, Number(data.message_id || 0));
        setDriveTranscript(data.text ? String(data.text) : 'Voice note' + (pending.voiceDuration > 0 ? ' · ' + formatDuration(pending.voiceDuration) : ''));
      }
      setDelivery(pending, 'sent', '');
      return pending;
    }
    return addMessage('mine', data, 'sent');
  }

  const player = document.createElement('audio');
  player.preload = 'auto';
  player.hidden = true;
  document.body.append(player);
  const audioQueue = [];
  const audioHistory = [];
  const ignoredAudioReplyIDs = [];
  let currentAudio;
  let voiceEnabled = false;
  let audioUnlocked = false;
  let unlockingAudio = false;
  let audioContext;
  let microphoneStream;
  let microphoneSource;
  let analyser;
  let recordingDelay;
  let recordingGain;
  let recordingDestination;
  let vadTimeData;
  let vadFrequencyData;
  let vadTimer;
  let noiseFloor = VAD_INITIAL_FLOOR;
  let floorFrozenUntil = 0;
  let startVotes = 0;
  let handsFreeCapture;
  let handsFreeStarting = false;
  let analysisMutedUntil = 0;
  let speakingStartedAt = 0;
  let playbackFloor = VAD_INITIAL_FLOOR;
  let bargeAboveMilliseconds = 0;
  let suppressPlaybackPauseUntil = 0;
  let awaitingClientID = '';
  let awaitingMessageID = 0;
  let activeReplyID = 0;
  let lateAudioUntil = 0;
  let replyTimer;
  let audioWaitTimer;
  let wakeLockSentinel;
  let wakeLockRequesting = false;

  function updateVoiceButton() {
    voiceButton.textContent = voiceEnabled ? '🔊' : '🔇';
    voiceButton.setAttribute('aria-pressed', String(voiceEnabled));
    renderDrive();
  }

  function updateHandsFreeButton() {
    handsFreeButton.textContent = handsFreeEnabled ? '🎙✓' : '🎙';
    handsFreeButton.setAttribute('aria-pressed', String(handsFreeEnabled));
    renderDrive();
  }

  function updateReplayButtons() {
    const disabled = !lastReplyMessageID || !lastReplyHasSpeech;
    replayAudioButton.disabled = disabled;
    driveReplayButton.disabled = disabled;
  }

  function createMessageAudioButton(messageID) {
    const button = document.createElement('button');
    button.className = 'message-audio';
    button.type = 'button';
    button.dataset.audioMessageId = String(messageID);
    let buttons = messageAudioButtons.get(messageID);
    if (!buttons) {
      buttons = new Set();
      messageAudioButtons.set(messageID, buttons);
    }
    buttons.add(button);
    button.addEventListener('click', event => {
      event.stopPropagation();
      playMessageAudio(messageID, true, true);
    });
    updateMessageAudioButton(button, messageID);
    return button;
  }

  function updateMessageAudioButton(button, messageID) {
    const playing = currentAudio && Number(currentAudio.message_id || 0) === messageID && !player.paused;
    const pending = pendingSpeakReplyIDs.has(messageID);
    button.textContent = pending ? '…' : playing ? '⏸' : '▶';
    button.setAttribute('aria-label', pending ? 'Preparing spoken reply' : playing ? 'Stop spoken reply' : 'Play spoken reply');
    button.setAttribute('aria-busy', String(pending));
  }

  function updateMessageAudioButtons() {
    messageAudioButtons.forEach((buttons, messageID) => {
      buttons.forEach(button => updateMessageAudioButton(button, messageID));
    });
    if (lastReplyMessageID) updateMessageAudioButton(driveReplyPlayButton, lastReplyMessageID);
    updateReplayButtons();
  }

  async function requestSpeakAudio(messageID) {
    if (speakRequests.has(messageID)) return speakRequests.get(messageID);
    pendingSpeakReplyIDs.add(messageID);
    updateMessageAudioButtons();
    const request = (async () => {
      const response = await fetch('/speak', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({message_id: messageID})
      });
      if (!response.ok) throw new Error('speech unavailable');
      const item = await response.json();
      if (Number(item.message_id || 0) !== messageID || !String(item.url || '').startsWith('/audio/')) {
        throw new Error('invalid speech response');
      }
      item.explicit = true;
      item.queuedAt = Date.now();
      return item;
    })();
    speakRequests.set(messageID, request);
    try {
      return await request;
    } finally {
      speakRequests.delete(messageID);
      pendingSpeakReplyIDs.delete(messageID);
      updateMessageAudioButtons();
    }
  }

  function queuedAudioForMessage(messageID) {
    if (currentAudio && Number(currentAudio.message_id || 0) === messageID) return currentAudio;
    return audioQueue.find(item => Number(item.message_id || 0) === messageID) || null;
  }

  function queueMessageAudio(item, replaceCurrent) {
    const messageID = Number(item.message_id || 0);
    for (let index = audioQueue.length - 1; index >= 0; index -= 1) {
      if (Number(audioQueue[index].message_id || 0) === messageID) audioQueue.splice(index, 1);
    }
    if (replaceCurrent) {
      suppressPlaybackPauseUntil = performance.now() + 500;
      player.pause();
      currentAudio = null;
      clearPlayerSource();
      audioQueue.unshift(item);
    } else {
      audioQueue.push(item);
    }
    updateMessageAudioButtons();
    playNext();
  }

  async function playMessageAudio(messageID, replaceCurrent, togglePlaying) {
    if (!messageID) return;
    if (togglePlaying && replaceCurrent && currentAudio && Number(currentAudio.message_id || 0) === messageID && !player.paused) {
      stopPlayback();
      return;
    }
    if (pendingSpeakReplyIDs.has(messageID)) return;
    if (!replaceCurrent && (lastAudioPlayedMessageID >= messageID || queuedAudioForMessage(messageID))) return;
    if (!audioUnlocked && !(await unlockAudio())) return;
    try {
      const item = await requestSpeakAudio(messageID);
      if (!replaceCurrent && (lastAudioPlayedMessageID >= messageID || queuedAudioForMessage(messageID))) return;
      queueMessageAudio(item, replaceCurrent);
    } catch (_) {
      setVoiceStatus('Spoken reply unavailable.', 4000);
      localNotice('error');
    }
  }

  function createAudioContext() {
    if (audioContext) return audioContext;
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) throw new Error('Web Audio unavailable');
    audioContext = new AudioContextClass();
    audioContext.addEventListener('statechange', resumeAudioContext);
    return audioContext;
  }

  function resumeAudioContext() {
    if (!audioContext || audioContext.state !== 'suspended' || document.visibilityState !== 'visible') return;
    if (!handsFreeEnabled && !voiceEnabled && state !== 'speaking') return;
    audioContext.resume().catch(() => {});
  }

  function playEarcon(kind) {
    if (!audioContext || state === 'speaking') return;
    audioContext.resume().catch(() => {});
    const tones = kind === 'armed' ? [[EARCON_ARM_HZ, EARCON_ARM_MS]] :
      kind === 'sending' ? [[EARCON_SEND_LOW_HZ, EARCON_SEND_TONE_MS], [EARCON_SEND_HIGH_HZ, EARCON_SEND_TONE_MS]] :
      kind === 'accepted' ? [[990, 70]] :
      kind === 'reply' ? [[560, 90]] :
      kind === 'endspeak' ? [[660, 55], [440, 55]] :
      kind === 'entering' ? [[520, 45], [760, 45]] :
      kind === 'reconnect' ? [[520, 40], [700, 40]] :
      kind === 'leaving' ? [[320, 60, 60], [320, 60]] :
      kind === 'document' ? [[1040, 60]] :
      [[EARCON_ERROR_HZ, EARCON_ERROR_MS]];
    let begins = audioContext.currentTime + 0.01;
    tones.forEach(([frequency, milliseconds, gap]) => {
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      const ends = begins + milliseconds / 1000;
      oscillator.frequency.value = frequency;
      gain.gain.setValueAtTime(0.0001, begins);
      gain.gain.linearRampToValueAtTime(EARCON_GAIN, begins + EARCON_ATTACK_MS / 1000);
      gain.gain.exponentialRampToValueAtTime(0.0001, ends);
      oscillator.connect(gain);
      gain.connect(audioContext.destination);
      oscillator.start(begins);
      oscillator.stop(ends);
      begins = ends + Number(gap || 0) / 1000;
    });
    analysisMutedUntil = performance.now() + (begins - audioContext.currentTime) * 1000 + EARCON_ANALYSIS_MUTE_MS;
  }

  function connectMicrophoneGraph(stream) {
    const context = createAudioContext();
    microphoneSource = context.createMediaStreamSource(stream);
    analyser = context.createAnalyser();
    analyser.fftSize = VAD_FFT_SIZE;
    analyser.smoothingTimeConstant = 0;
    recordingDelay = context.createDelay(1);
    recordingDelay.delayTime.value = VAD_PRE_ROLL_SECONDS;
    recordingGain = context.createGain();
    recordingDestination = context.createMediaStreamDestination();
    microphoneSource.connect(analyser);
    microphoneSource.connect(recordingDelay);
    recordingDelay.connect(recordingGain);
    recordingGain.connect(recordingDestination);
    vadTimeData = new Float32Array(analyser.fftSize);
    vadFrequencyData = new Float32Array(analyser.frequencyBinCount);
  }

  function releaseMicrophone() {
    stopVAD();
    if (microphoneSource) microphoneSource.disconnect();
    if (recordingDelay) recordingDelay.disconnect();
    if (recordingGain) recordingGain.disconnect();
    if (microphoneStream) microphoneStream.getTracks().forEach(track => track.stop());
    microphoneStream = null;
    microphoneSource = null;
    analyser = null;
    recordingDelay = null;
    recordingGain = null;
    recordingDestination = null;
    vadTimeData = null;
    vadFrequencyData = null;
  }

  // Estimate speech-band RMS by weighting centered time-domain RMS with the
  // square root of the 300–3400 Hz FFT-power fraction; thresholds stay in RMS units.
  function estimateSpeechEnergy() {
    analyser.getFloatTimeDomainData(vadTimeData);
    let mean = 0;
    for (const sample of vadTimeData) mean += sample;
    mean /= vadTimeData.length;
    let timePower = 0;
    for (const sample of vadTimeData) {
      const centered = sample - mean;
      timePower += centered * centered;
    }
    const timeRMS = Math.sqrt(timePower / vadTimeData.length);

    analyser.getFloatFrequencyData(vadFrequencyData);
    const hertzPerBin = audioContext.sampleRate / analyser.fftSize;
    const firstBin = Math.max(1, Math.ceil(VAD_LOW_HZ / hertzPerBin));
    const lastBin = Math.min(vadFrequencyData.length - 1, Math.floor(VAD_HIGH_HZ / hertzPerBin));
    let allPower = 0;
    let bandPower = 0;
    let bandLogPower = 0;
    let bandBins = 0;
    for (let index = 1; index < vadFrequencyData.length; index += 1) {
      const decibels = vadFrequencyData[index];
      const power = Number.isFinite(decibels) ? Math.pow(10, decibels / 10) : 0;
      allPower += power;
      if (index < firstBin || index > lastBin) continue;
      bandPower += power;
      bandLogPower += Math.log(Math.max(power, 1e-12));
      bandBins += 1;
    }
    const bandRatio = allPower > 0 ? Math.sqrt(bandPower / allPower) : 0;
    const arithmeticMean = bandBins ? bandPower / bandBins : 0;
    const flatness = arithmeticMean > 0 ? Math.exp(bandLogPower / bandBins) / arithmeticMean : 1;
    return {rms: timeRMS * bandRatio, flatness};
  }

  function startVAD() {
    if (vadTimer || !handsFreeEnabled || !analyser || document.visibilityState === 'hidden') return;
    vadTimer = window.setInterval(sampleVAD, VAD_SAMPLE_MS);
  }

  function stopVAD() {
    window.clearInterval(vadTimer);
    vadTimer = null;
  }

  function sampleVAD() {
    if (!handsFreeEnabled || !analyser || performance.now() < analysisMutedUntil) return;
    const now = performance.now();
    const energy = estimateSpeechEnergy();
    if (state === 'listening') {
      const threshold = Math.max(noiseFloor * VAD_START_FLOOR_MULTIPLIER, VAD_START_MIN_RMS);
      const isSpeech = energy.rms > threshold && energy.flatness < VAD_MAX_FLATNESS;
      startVotes = isSpeech ? startVotes + 1 : 0;
      if (startVotes >= VAD_START_SAMPLES) {
        startVotes = 0;
        startHandsFreeRecording(false);
        return;
      }
      if (now >= floorFrozenUntil) {
        noiseFloor += VAD_NOISE_ALPHA * (energy.rms - noiseFloor);
      }
      return;
    }
    if (state === 'recording' && handsFreeCapture && !handsFreeCapture.finishing) {
      const threshold = Math.max(noiseFloor * VAD_END_FLOOR_MULTIPLIER, VAD_END_MIN_RMS);
      if (energy.rms >= threshold) {
        handsFreeCapture.belowSince = 0;
        handsFreeCapture.lastSpeechAt = now;
      } else if (!handsFreeCapture.belowSince) {
        handsFreeCapture.belowSince = now;
      } else if (now - handsFreeCapture.belowSince >= VAD_HANGOVER_MS) {
        floorFrozenUntil = now + VAD_FLOOR_FREEZE_MS;
        finishHandsFreeRecording(false, VAD_RECORDER_STOP_DELAY_MS);
      }
      if (now - handsFreeCapture.started >= VAD_MAX_UTTERANCE_MS) {
        finishHandsFreeRecording(true, VAD_RECORDER_STOP_DELAY_MS);
      }
      return;
    }
    if (state !== 'speaking') return;
    const speakingMilliseconds = now - speakingStartedAt;
    if (speakingMilliseconds < BARGE_IGNORE_MS) {
      playbackFloor += BARGE_FLOOR_ALPHA * (energy.rms - playbackFloor);
      return;
    }
    const threshold = Math.max(playbackFloor * BARGE_FLOOR_MULTIPLIER, BARGE_MIN_RMS);
    bargeAboveMilliseconds = energy.rms > threshold ? bargeAboveMilliseconds + VAD_SAMPLE_MS : 0;
    if (bargeAboveMilliseconds >= BARGE_REQUIRED_MS) bargeIn();
  }

  function startHandsFreeRecording(isBargeIn) {
    if (!handsFreeEnabled || handsFreeCapture || !recordingDestination) return;
    let recorder;
    try {
      const mimeType = recorderMimeType();
      recorder = mimeType ? new MediaRecorder(recordingDestination.stream, {mimeType}) : new MediaRecorder(recordingDestination.stream);
    } catch (_) {
      setState('listening', true);
      localNotice('error');
      setVoiceStatus('microphone recording failed', 4000);
      return;
    }
    const started = performance.now();
    const capture = {
      recorder,
      started,
      speechStarted: started - (VAD_START_SAMPLES - 1) * VAD_SAMPLE_MS,
      lastSpeechAt: started,
      belowSince: 0,
      chunks: [],
      finishing: false,
      forceUpload: false,
      discard: false,
      saveAsDraft: false,
      cancelNotice: '',
      failed: false,
      unmuteTimer: 0,
      stopTimer: 0
    };
    handsFreeCapture = capture;
    recorder.addEventListener('dataavailable', event => {
      if (event.data && event.data.size) capture.chunks.push(event.data);
    });
    recorder.addEventListener('error', () => {
      capture.failed = true;
      if (handsFreeCapture === capture) handsFreeCapture = null;
      window.clearTimeout(capture.stopTimer);
      window.clearTimeout(capture.unmuteTimer);
      if (recordingGain) recordingGain.gain.value = 1;
      setState(handsFreeEnabled ? 'listening' : 'idle', true);
      localNotice('error');
      setVoiceStatus('microphone recording failed', 4000);
    }, {once: true});
    recorder.addEventListener('stop', () => completeHandsFreeRecording(capture), {once: true});
    if (isBargeIn) {
      recordingGain.gain.value = 0;
      capture.unmuteTimer = window.setTimeout(() => {
        if (handsFreeCapture === capture && recordingGain) recordingGain.gain.value = 1;
      }, BARGE_DROP_MS);
    } else {
      recordingGain.gain.value = 1;
    }
    try {
      recorder.start(MEDIA_RECORDER_TIMESLICE_MS);
    } catch (_) {
      handsFreeCapture = null;
      window.clearTimeout(capture.unmuteTimer);
      recordingGain.gain.value = 1;
      setState('listening', true);
      localNotice('error');
      setVoiceStatus('microphone recording failed', 4000);
      return;
    }
    setState('recording');
  }

  function finishHandsFreeRecording(forceUpload, delay) {
    const capture = handsFreeCapture;
    if (!capture || capture.finishing || capture.recorder.state === 'inactive') return;
    capture.finishing = true;
    capture.forceUpload = forceUpload;
    capture.stopTimer = window.setTimeout(() => {
      if (capture.recorder.state !== 'inactive') capture.recorder.stop();
    }, delay);
  }

  function completeHandsFreeRecording(capture) {
    if (handsFreeCapture === capture) handsFreeCapture = null;
    window.clearTimeout(capture.stopTimer);
    window.clearTimeout(capture.unmuteTimer);
    if (recordingGain) recordingGain.gain.value = 1;
    if (capture.failed) return;
    if (capture.saveAsDraft) {
      const actualType = capture.recorder.mimeType || (capture.chunks[0] && capture.chunks[0].type) || 'audio/webm';
      const blob = new Blob(capture.chunks, {type: actualType});
      setState(handsFreeEnabled ? 'listening' : 'idle', true);
      setDriveTranscript('saved as draft');
      if (blob.size) {
        keepDriveDraft({
          blob,
          mimeType: actualType,
          duration: recordingMilliseconds(capture) / 1000,
          clientID: clientID(),
          source: 'drive'
        }, capture.cancelNotice === 'draft-saved');
      } else {
        localNotice('error');
      }
      return;
    }
    if (capture.discard || !handsFreeEnabled) return;
    const speechMilliseconds = Math.max(0, capture.lastSpeechAt - capture.speechStarted + VAD_SAMPLE_MS);
    if (!capture.forceUpload && speechMilliseconds < VAD_MIN_UTTERANCE_MS) {
      setState('listening', true);
      return;
    }
    const actualType = capture.recorder.mimeType || (capture.chunks[0] && capture.chunks[0].type) || 'audio/webm';
    const blob = new Blob(capture.chunks, {type: actualType});
    if (!blob.size) {
      setState('listening', true);
      localNotice('error');
      setVoiceStatus('microphone recording failed', 4000);
      return;
    }
    beginLiveSendBeat(blob, actualType, (performance.now() - capture.started) / 1000);
  }

  function beginLiveSendBeat(blob, mimeType, duration) {
    setState('sending');
    const row = addMessage('mine', {
      voice: true,
      duration_seconds: duration,
      timestamp: new Date().toISOString()
    }, 'sending', {forceScroll: true});
    const id = clientID();
    pendingRows.set(id, row);
    liveSendBeat = {blob, mimeType, duration, clientID: id, row, timer: 0};
    liveSendBeat.timer = window.setTimeout(() => deliverLiveSendBeat(id), DRIVE_LIVE_SEND_DELAY_MS);
  }

  function deliverLiveSendBeat(expectedClientID) {
    const pending = liveSendBeat;
    if (!pending || (expectedClientID && pending.clientID !== expectedClientID)) return false;
    window.clearTimeout(pending.timer);
    liveSendBeat = null;
    resetReplyTracking();
    awaitingClientID = pending.clientID;
    deliverVoice({
      blob: pending.blob,
      mimeType: pending.mimeType,
      clientID: pending.clientID,
      row: pending.row,
      attempt: 0,
      handsFree: true
    });
    return true;
  }

  function cancelLiveSendBeat(announce) {
    const pending = liveSendBeat;
    if (!pending) return false;
    window.clearTimeout(pending.timer);
    liveSendBeat = null;
    pendingRows.delete(pending.clientID);
    resetReplyTracking();
    setState(handsFreeEnabled ? 'listening' : 'idle', true);
    if (draftDecision(pending.duration * 1000) === 'draft') {
      setDelivery(pending.row, 'not sent — saved as draft', 'failed');
      setDriveTranscript('saved as draft');
      keepDriveDraft({
        blob: pending.blob,
        mimeType: pending.mimeType,
        duration: pending.duration,
        clientID: pending.clientID,
        source: 'drive'
      }, announce !== false);
    } else {
      setDelivery(pending.row, 'not sent — cancelled', 'failed');
      setDriveTranscript('cancelled');
      if (announce !== false) localNotice('send-cancelled');
    }
    return true;
  }

  function preserveVoiceWorkOnHide() {
    const action = hideVoiceAction({
      liveSendBeat: Boolean(liveSendBeat),
      handsFree: Boolean(handsFreeCapture)
    });
    if (action === 'deliver-live-beat') {
      deliverLiveSendBeat();
    } else if (action === 'finish-hands-free') {
      finishHandsFreeRecording(true, VAD_RECORDER_STOP_DELAY_MS);
    } else {
      preserveUnreleasedRecordingAsDraft(false);
    }
  }

  function resetReplyTracking() {
    window.clearTimeout(replyTimer);
    window.clearTimeout(audioWaitTimer);
    replyTimer = null;
    audioWaitTimer = null;
    awaitingClientID = '';
    awaitingMessageID = 0;
    activeReplyID = 0;
    lateAudioUntil = 0;
  }

  function handsFreeUploadAccepted(id, messageID) {
    if (!handsFreeEnabled || id !== awaitingClientID || !messageID) return;
    awaitingMessageID = messageID;
    setState('thinking');
    localNotice('sent');
    replyTimer = window.setTimeout(() => {
      if (!handsFreeEnabled || state !== 'thinking' || activeReplyID) return;
      resetReplyTracking();
      setState('listening');
      localNotice('reply-timeout');
    }, REPLY_TIMEOUT_MS);
  }

  function driveUploadAccepted(id, messageID) {
    if (id !== awaitingClientID || !messageID) return;
    awaitingMessageID = messageID;
    setState('thinking');
    localNotice('sent');
    replyTimer = window.setTimeout(() => {
      if (state !== 'thinking' || activeReplyID) return;
      resetReplyTracking();
      setState(handsFreeEnabled ? 'listening' : 'idle');
      localNotice('reply-timeout');
    }, REPLY_TIMEOUT_MS);
  }

  function handsFreeUploadFailed(id) {
    if (!handsFreeEnabled || id !== awaitingClientID) return;
    resetReplyTracking();
    setState('listening', true);
    localNotice('error');
  }

  function handleHandsFreeReply(data) {
    if (!handsFreeEnabled || state !== 'thinking' || data.replay || !awaitingMessageID || activeReplyID) return;
    const replyTo = Number(data.reply_to || 0);
    if (replyTo !== 0 && replyTo !== awaitingMessageID) return;
    if (normaliseDocumentAttachment(data.attachment)) {
      resetReplyTracking();
      setState('listening');
      return;
    }
    activeReplyID = Number(data.message_id || 0);
    if (!activeReplyID) return;
    localNotice('reply-ready');
    window.clearTimeout(replyTimer);
    replyTimer = null;
    lateAudioUntil = Date.now() + REPLY_TIMEOUT_MS;
    if (!voiceEnabled || driveMuted) {
      resetReplyTracking();
      setState('listening');
      return;
    }
    refreshAudioWait();
  }

  function handleDriveReply(data) {
    if (handsFreeEnabled || state !== 'thinking' || data.replay || !awaitingMessageID || activeReplyID) return;
    const replyTo = Number(data.reply_to || 0);
    if (replyTo !== 0 && replyTo !== awaitingMessageID) return;
    if (normaliseDocumentAttachment(data.attachment)) {
      resetReplyTracking();
      setState('idle');
      return;
    }
    activeReplyID = Number(data.message_id || 0);
    if (!activeReplyID) return;
    localNotice('reply-ready');
    window.clearTimeout(replyTimer);
    replyTimer = null;
    lateAudioUntil = Date.now() + REPLY_TIMEOUT_MS;
    if (!voiceEnabled || driveMuted) {
      resetReplyTracking();
      setState('idle');
      return;
    }
    refreshAudioWait();
  }

  function refreshAudioWait() {
    if (!activeReplyID || state !== 'thinking') return;
    window.clearTimeout(audioWaitTimer);
    audioWaitTimer = window.setTimeout(() => {
      if (state === 'thinking') setState(handsFreeEnabled ? 'listening' : 'idle');
    }, REPLY_AUDIO_WAIT_MS);
  }

  function acceptsHandsFreeAudio(item) {
    const messageID = Number(item.message_id || 0);
    if (ignoredAudioReplyIDs.includes(messageID)) return false;
    if (!handsFreeEnabled) return true;
    return messageID > 0 && messageID === activeReplyID && Date.now() <= lateAudioUntil;
  }

  function ignoreAudioReply(messageID) {
    if (!messageID || ignoredAudioReplyIDs.includes(messageID)) return;
    ignoredAudioReplyIDs.push(messageID);
    if (ignoredAudioReplyIDs.length > 20) ignoredAudioReplyIDs.shift();
  }

  function markInterrupted(item) {
    const row = rows.get(rowKey('agent', Number(item && item.message_id || 0)));
    if (!row || row.classList.contains('interrupted')) return;
    row.classList.add('interrupted');
    const label = document.createElement('span');
    label.className = 'interruption';
    label.textContent = '⚠ interrupted';
    row.metaNode.append(label);
  }

  function interruptCurrentReply() {
    if (state !== 'speaking' || !currentAudio) return false;
    const interrupted = currentAudio;
    const messageID = Number(interrupted.message_id || 0);
    markInterrupted(interrupted);
    ignoreAudioReply(messageID);
    for (let index = audioQueue.length - 1; index >= 0; index -= 1) {
      if (Number(audioQueue[index].message_id || 0) === messageID) audioQueue.splice(index, 1);
    }
    if (audioHistory[audioHistory.length - 1] === interrupted) audioHistory.pop();
    updateReplayButtons();
    suppressPlaybackPauseUntil = performance.now() + 500;
    player.pause();
    currentAudio = null;
    clearPlayerSource();
    stopAudioButton.hidden = true;
    updateMessageAudioButtons();
    return true;
  }

  function bargeIn() {
    if (!handsFreeEnabled || state !== 'speaking' || handsFreeCapture) return;
    if (!interruptCurrentReply()) return;
    startHandsFreeRecording(true);
    localNotice('barge-in');
  }

  function handleMicrophoneLost() {
    if (!handsFreeEnabled) return;
    handsFreeEnabled = false;
    updateHandsFreeButton();
    resetReplyTracking();
    if (handsFreeCapture && handsFreeCapture.recorder.state !== 'inactive') {
      handsFreeCapture.discard = true;
      handsFreeCapture.recorder.stop();
    }
    releaseMicrophone();
    micButton.disabled = false;
    setState('idle', true);
    localNotice('error');
    setVoiceStatus('microphone lost — tap hands-free to resume');
    updateWakeLock();
  }

  async function enableHandsFree(keepMuted) {
    if (handsFreeStarting || handsFreeEnabled) return;
    handsFreeStarting = true;
    handsFreeButton.disabled = true;
    let stream;
    try {
      createAudioContext();
      const contextReady = audioContext.resume();
      const playbackReady = audioUnlocked ? Promise.resolve(true) : unlockAudio();
      await contextReady;
      if (!(await playbackReady)) throw new Error('audio unlock failed');
      if (!voiceEnabled && !keepMuted && !(await changeVoicePreference(true))) throw new Error('voice preference failed');
      stream = await navigator.mediaDevices.getUserMedia({audio: {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true
      }});
      microphoneStream = stream;
      connectMicrophoneGraph(stream);
      stream.getAudioTracks().forEach(track => { track.onended = handleMicrophoneLost; });
      noiseFloor = VAD_INITIAL_FLOOR;
      floorFrozenUntil = performance.now();
      handsFreeEnabled = true;
      updateHandsFreeButton();
      micButton.disabled = true;
      setVoiceStatus('');
      if (currentAudio || audioQueue.length) enterHandsFreeSpeaking();
      else setState('listening');
      startVAD();
      updateWakeLock();
    } catch (error) {
      if (stream) stream.getTracks().forEach(track => track.stop());
      microphoneStream = null;
      releaseMicrophone();
      handsFreeEnabled = false;
      updateHandsFreeButton();
      setState('idle', true);
      localNotice('error');
      const denied = error && (error.name === 'NotAllowedError' || error.name === 'SecurityError');
      setVoiceStatus(denied ? 'Microphone permission denied — allow it in browser settings, then tap hands-free.' : 'Hands-free microphone unavailable — check browser permission.');
    } finally {
      handsFreeStarting = false;
      handsFreeButton.disabled = false;
    }
  }

  function disableHandsFree() {
    if (!handsFreeEnabled && !handsFreeStarting) return;
    cancelLiveSendBeat(false);
    handsFreeEnabled = false;
    updateHandsFreeButton();
    resetReplyTracking();
    if (handsFreeCapture && handsFreeCapture.recorder.state !== 'inactive') {
      handsFreeCapture.discard = true;
      handsFreeCapture.recorder.stop();
    }
    releaseMicrophone();
    micButton.disabled = false;
    stopPlayback();
    setState('idle', true);
    setVoiceStatus('');
    updateWakeLock();
  }

  function updateMediaMetadata(item) {
    if (!navigator.mediaSession || !window.MediaMetadata || !item) return;
    const row = rows.get(rowKey('agent', Number(item.message_id || 0)));
    navigator.mediaSession.metadata = new MediaMetadata({
      title: String(row ? row.replyText : '').slice(0, 60),
      artist: 'C3'
    });
  }

  function clearPlayerSource() {
    player.removeAttribute('src');
    player.load();
  }

  function stopPlayback() {
    const wasSpeaking = state === 'speaking';
    suppressPlaybackPauseUntil = performance.now() + 500;
    player.pause();
    currentAudio = null;
    audioQueue.length = 0;
    clearPlayerSource();
    stopAudioButton.hidden = true;
    updateMessageAudioButtons();
    if (handsFreeEnabled) setState('listening');
    else if (currentView === 'drive' && state === 'speaking') setState('idle');
    if (wasSpeaking) localNotice('speaking-end');
  }

  function mutePlaybackNow() {
    if (currentAudio) ignoreAudioReply(Number(currentAudio.message_id || 0));
    if (activeReplyID) ignoreAudioReply(activeReplyID);
    audioQueue.forEach(item => ignoreAudioReply(Number(item.message_id || 0)));
    stopPlayback();
  }

  function playNext() {
    if (currentAudio || !audioQueue.length || unlockingAudio) return;
    const next = audioQueue[0];
    if (!voiceEnabled && !next.explicit) return;
    if (!rows.has(rowKey('agent', Number(next.message_id || 0))) && Date.now() - Number(next.queuedAt || 0) < 2000) {
      window.setTimeout(playNext, 50);
      return;
    }
    currentAudio = audioQueue.shift();
    const playing = currentAudio;
    player.src = playing.url;
    updateMediaMetadata(playing);
    player.play().then(() => {
      if (currentAudio !== playing) return;
      audioUnlocked = true;
      audioHistory.push(playing);
      if (audioHistory.length > 20) audioHistory.shift();
      lastAudioPlayedMessageID = Math.max(lastAudioPlayedMessageID, Number(playing.message_id || 0));
      updateReplayButtons();
      updateMessageAudioButtons();
    }).catch(() => {
      if (currentAudio !== playing) return;
      audioQueue.unshift(playing);
      currentAudio = null;
      audioUnlocked = false;
      if (handsFreeEnabled) setState('listening', true);
      setVoiceStatus('Tap 🔊 to unlock spoken replies.');
      updateMessageAudioButtons();
    });
  }

  function replayAt(index) {
    const item = audioHistory[index];
    if (!item) return;
    playMessageAudio(Number(item.message_id || 0), true, false);
  }

  function replayLast() {
    playMessageAudio(lastReplyMessageID, true, false);
  }

  function replayPrevious() {
    const currentID = Number(currentAudio && currentAudio.message_id || lastReplyMessageID || 0);
    for (let index = audioHistory.length - 1; index >= 0; index -= 1) {
      const messageID = Number(audioHistory[index].message_id || 0);
      if (messageID && messageID !== currentID) {
        playMessageAudio(messageID, true, false);
        return;
      }
    }
  }

  async function unlockAudio() {
    unlockingAudio = true;
    player.src = '/audio/unlock';
    try {
      await player.play();
      audioUnlocked = true;
      player.pause();
      clearPlayerSource();
      setVoiceStatus('');
      return true;
    } catch (_) {
      audioUnlocked = false;
      setVoiceStatus('Could not unlock audio playback.', 4000);
      return false;
    } finally {
      unlockingAudio = false;
    }
  }

  async function changeVoicePreference(enabled, keepHandsFree) {
    if (enabled && !audioUnlocked && !(await unlockAudio())) return false;
    try {
      const response = await fetch('/voice', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({enabled})
      });
      if (!response.ok) throw new Error('preference failed');
      voiceEnabled = enabled;
      updateVoiceButton();
      if (!enabled) {
        if (handsFreeEnabled && !keepHandsFree) disableHandsFree();
        stopPlayback();
      } else {
        playNext();
      }
      updateWakeLock();
      return true;
    } catch (_) {
      setVoiceStatus('Could not change spoken replies.', 4000);
      return false;
    }
  }

  voiceButton.addEventListener('click', async () => {
    if (voiceEnabled && !audioUnlocked) {
      if (await unlockAudio()) playNext();
      return;
    }
    const enabled = !voiceEnabled;
    setDriveMuted(!enabled);
    await changeVoicePreference(enabled);
  });

  handsFreeButton.addEventListener('click', () => {
    if (handsFreeEnabled) disableHandsFree();
    else {
      setDriveMuted(false);
      enableHandsFree(false);
    }
  });

  stopAudioButton.addEventListener('click', stopPlayback);
  replayAudioButton.addEventListener('click', replayLast);
  function enterHandsFreeSpeaking() {
    const wasSpeaking = state === 'speaking';
    window.clearTimeout(audioWaitTimer);
    audioWaitTimer = null;
    speakingStartedAt = performance.now();
    playbackFloor = noiseFloor;
    bargeAboveMilliseconds = 0;
    setState('speaking');
    if (!wasSpeaking) localNotice('speaking-start');
  }

  player.addEventListener('play', () => {
    if (unlockingAudio) return;
    stopAudioButton.hidden = false;
    updateMessageAudioButtons();
    if (handsFreeEnabled || currentView === 'drive') enterHandsFreeSpeaking();
  });
  player.addEventListener('pause', () => {
    if (unlockingAudio || performance.now() < suppressPlaybackPauseUntil) return;
    stopAudioButton.hidden = true;
    updateMessageAudioButtons();
    if (handsFreeEnabled && state === 'speaking') {
      setState('listening');
      localNotice('speaking-end');
    } else if (currentView === 'drive' && state === 'speaking') {
      setState('idle');
      localNotice('speaking-end');
    }
  });

  function finishPlayback() {
    if (unlockingAudio) return;
    const wasSpeaking = state === 'speaking';
    currentAudio = null;
    stopAudioButton.hidden = true;
    clearPlayerSource();
    updateMessageAudioButtons();
    if (audioQueue.length) {
      playNext();
    } else if (handsFreeEnabled) {
      setState('listening');
      if (wasSpeaking) localNotice('speaking-end');
    } else if (currentView === 'drive') {
      setState('idle');
      if (wasSpeaking) localNotice('speaking-end');
    }
  }

  player.addEventListener('ended', finishPlayback);
  player.addEventListener('error', finishPlayback);

  if (navigator.mediaSession) {
    const actions = {
      play: () => currentAudio ? player.play() : replayLast(),
      pause: stopPlayback,
      stop: stopPlayback,
      nexttrack: replayLast,
      previoustrack: replayPrevious
    };
    Object.entries(actions).forEach(([name, handler]) => {
      try { navigator.mediaSession.setActionHandler(name, handler); } catch (_) {}
    });
  }

  function wantsWakeLock() {
    return currentView === 'drive' || voiceEnabled || handsFreeEnabled;
  }

  async function requestWakeLock() {
    if (!navigator.wakeLock || wakeLockSentinel || wakeLockRequesting || !wantsWakeLock() || document.visibilityState !== 'visible') return;
    wakeLockRequesting = true;
    try {
      const sentinel = await navigator.wakeLock.request('screen');
      wakeLockSentinel = sentinel;
      sentinel.addEventListener('release', () => {
        if (wakeLockSentinel === sentinel) wakeLockSentinel = null;
        if (wantsWakeLock() && document.visibilityState === 'visible') window.setTimeout(requestWakeLock, 0);
      }, {once: true});
    } catch (_) {
    } finally {
      wakeLockRequesting = false;
    }
  }

  function updateWakeLock() {
    if (wantsWakeLock()) {
      requestWakeLock();
    } else if (wakeLockSentinel) {
      const sentinel = wakeLockSentinel;
      wakeLockSentinel = null;
      sentinel.release().catch(() => {});
    }
  }

  function connect() {
    setConnection('reconnecting…', '');
    const events = new EventSource('/events');
    events.onopen = () => {
      const reconnected = streamOpenedOnce;
      streamOpenedOnce = true;
      setConnection(detached ? 'no session attached — reconnected' : '● connected', detached ? 'detached' : 'connected');
      if (handsFreeEnabled && awaitingMessageID && !activeReplyID && state === 'listening') setState('thinking');
      if (reconnected) {
        localNotice('reconnected');
        reconnectCatchUpPending = true;
        scheduleReconnectCatchUp();
      } else {
        scheduleFreshHistoryFinish();
      }
