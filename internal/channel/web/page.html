      if (closed && handsFreeEnabled && state === 'thinking') {
        resetReplyTracking();
        setState('listening');
      }
    };
    function markConnected() {
      if (presenceKnown) return;
      const announce = driveIsHeld() || connectionClass !== 'connected';
      detached = false;
      permissionHeld = false;
      setConnection('connected', 'connected');
      if (announce) localNotice('connected');
    }
    events.addEventListener('presence', event => {
      const data = JSON.parse(event.data);
      const wasPresenceKnown = presenceKnown;
      const wasDetached = detached;
      const wasPermissionHeld = permissionHeld;
      const signature = presenceSignature(data);
      const changed = signature !== lastPresenceSignature;
      lastPresenceSignature = signature;
      presenceKnown = true;
      presence = {
        attached: Boolean(data.attached),
        cli: String(data.cli || ''),
        cwd: String(data.cwd || ''),
        pid: Number(data.pid || 0),
        sessionID: String(data.session_id || ''),
        since: String(data.since || '')
      };
      detached = !presence.attached;
      if (presence.attached) permissionHeld = false;
      setConnection(presenceShortText(), presence.attached ? 'connected' : 'detached');
      renderPresenceSheet();
      if (!data.replay) {
        if (!presence.attached && changed) announcePresenceChange('no-session');
        else if (presence.attached && wasPermissionHeld) announcePresenceChange('permission-returned');
        else if (presence.attached && (wasDetached || !wasPresenceKnown)) announcePresenceChange('session-returned');
      }
    });
    events.addEventListener('message', event => {
      markConnected();
      const data = JSON.parse(event.data);
      if (freshHistoryPending && data.replay) {
        rememberFreshReplay('agent', data);
        return;
      }
      if (freshHistoryPending) finishFreshHistory();
      addMessage('agent', data);
      announceDocumentReceived(data);
      handleHandsFreeReply(data);
      handleDriveReply(data);
      scheduleReconnectCatchUp();
    });
    events.addEventListener('own', event => {
      const data = JSON.parse(event.data);
      if (freshHistoryPending && data.replay) {
        rememberFreshReplay('mine', data);
        return;
      }
      if (freshHistoryPending) finishFreshHistory();
      renderOwn(data);
    });
    events.addEventListener('status', event => {
      const data = JSON.parse(event.data);
      addMessage('status', data);
      if (String(data.text || '').startsWith('📨 Held')) {
        if (!presenceKnown) {
          const announce = !detached;
          detached = true;
          setConnection('no session attached', 'detached');
          if (announce) localNotice('no-session');
        }
      } else if (String(data.text || '').startsWith('⏸ Permission')) {
        const announce = !permissionHeld;
        permissionHeld = true;
        renderDrive();
        if (announce) localNotice('permission-held');
      }
    });
    events.addEventListener('typing', () => {
      markConnected();
      typing.textContent = 'agent is typing…';
      window.clearTimeout(typingTimer);
      typingTimer = window.setTimeout(() => { typing.textContent = ''; }, 3500);
      if (handsFreeEnabled && state === 'thinking' && activeReplyID) refreshAudioWait();
    });
    events.addEventListener('edit', event => {
      markConnected();
      const data = JSON.parse(event.data);
      if (freshHistoryPending && data.replay) {
        rememberFreshReplay('edit', data);
        return;
      }
      if (freshHistoryPending) finishFreshHistory();
      if (data.voice) {
        const messageID = Number(data.message_id || 0);
        const row = rows.get(rowKey('mine', messageID));
        const hidden = replayHistoryByKey.get(rowKey('mine', messageID));
        const duration = Number(row ? row.voiceDuration : hidden && hidden.data.duration_seconds || 0);
        if (row) {
          renderVoice(row.bodyNode, {
            voice: true, duration_seconds: row.voiceDuration, text: data.text || ''
          });
        } else if (!updateHiddenReplayEntry('mine', data)) {
          addMessage('mine', data, 'sent');
        }
        if (messageID >= lastTranscriptMessageID) {
          lastTranscriptMessageID = messageID;
          setDriveTranscript(data.text ? String(data.text) : 'Voice note' + (duration > 0 ? ' · ' + formatDuration(duration) : ''));
        }
      } else {
        const messageID = Number(data.message_id || 0);
        const row = rows.get(rowKey('agent', messageID));
        if (row) {
          row.replyText = String(data.text || '');
          renderText(row.bodyNode, data.text || '');
          if (row.attachment) row.bodyNode.append(createDocumentCard(row.attachment));
        } else if (!updateHiddenReplayEntry('agent', data)) addMessage('agent', data);
        if (messageID === lastReplyMessageID) updateDriveReply(data.text || '', data.message_id, row && row.attachment);
      }
      scheduleReconnectCatchUp();
    });
    events.addEventListener('prefs', event => {
      const data = JSON.parse(event.data);
      voiceEnabled = Boolean(data.voice);
      updateVoiceButton();
      if (!voiceEnabled) {
        if (handsFreeEnabled && !(currentView === 'drive' && driveMuted)) disableHandsFree();
        stopPlayback();
      }
      updateWakeLock();
      scheduleReconnectCatchUp();
    });
    events.addEventListener('audio', event => {
      if (!voiceEnabled || (currentView === 'drive' && driveMuted)) return;
      const item = JSON.parse(event.data);
      if (!acceptsHandsFreeAudio(item)) return;
      if (queuedAudioForMessage(Number(item.message_id || 0))) return;
      item.queuedAt = Date.now();
      window.clearTimeout(audioWaitTimer);
      audioWaitTimer = null;
      audioQueue.push(item);
      playNext();
    });
  }

  function scheduleReconnectCatchUp() {
    if (!reconnectCatchUpPending) return;
    window.clearTimeout(reconnectCatchUpTimer);
    reconnectCatchUpTimer = window.setTimeout(() => {
      reconnectCatchUpPending = false;
      if (!voiceEnabled || driveMuted || !newestAgentReplyID || newestAgentReplyID <= lastAudioPlayedMessageID) return;
      if (catchUpRequestedReplyIDs.has(newestAgentReplyID)) return;
      catchUpRequestedReplyIDs.add(newestAgentReplyID);
      playMessageAudio(newestAgentReplyID, false, false);
    }, HISTORY_REPLAY_SETTLE_MS);
  }

  let driveHold;
  let lockedCancelHold;
  let lastDriveReleaseAt = -DRIVE_CLICK_GUARD_MS;
  let liveHold;
  let edgeSwipe;

  driveView.addEventListener('pointerdown', event => {
    if (!driveMuteButton.contains(event.target)) activateDriveAudio();
  }, true);

  function capturePointer(node, pointerID) {
    try { node.setPointerCapture(pointerID); } catch (_) {}
  }

  function cancelDriveHoldRecording(noticeKind) {
    const notice = noticeKind || 'recording-cancelled';
    setDriveLocked(false);
    if (recording && recording.source === 'drive') {
      if (draftDecision(recordingMilliseconds(recording)) === 'draft') {
        stopRecording(false, false, 'draft-saved', true);
      } else {
        stopRecording(true, false, notice);
      }
      return;
    }
    if (recordingStarting) {
      drivePendingRecordingAction = 'cancel-locked';
      return;
    }
    const capture = handsFreeCapture;
    if (!capture || capture.recorder.state === 'inactive') return;
    if (draftDecision(recordingMilliseconds(capture)) === 'draft') {
      capture.saveAsDraft = true;
      capture.cancelNotice = 'draft-saved';
    } else {
      capture.discard = true;
    }
    capture.finishing = true;
    window.clearTimeout(capture.stopTimer);
    window.clearTimeout(capture.unmuteTimer);
    if (recordingGain) recordingGain.gain.value = 1;
    capture.recorder.stop();
    if (!capture.saveAsDraft) {
      setState(handsFreeEnabled ? 'listening' : 'idle', true);
      setDriveTranscript('cancelled');
      localNotice(notice);
    }
  }

  driveCircle.addEventListener('pointerdown', event => {
    if (event.button !== 0 || !event.isPrimary || currentView !== 'drive' || driveHold) return;
    event.preventDefault();
    if (driveLocked) {
      driveHold = {
        pointerID: event.pointerId,
        startX: event.clientX,
        startY: event.clientY,
        mode: 'locked-send',
        cancelArmed: false,
        locked: true,
        timer: 0
      };
      driveCircle.classList.add('drive-pressed');
      capturePointer(driveCircle, event.pointerId);
      return;
    }
    if (liveSendBeat) {
      driveHold = {pointerID: event.pointerId, startX: event.clientX, startY: event.clientY, mode: 'cancelled-send', cancelArmed: false, locked: false, timer: 0};
      driveCircle.classList.add('drive-pressed');
      capturePointer(driveCircle, event.pointerId);
      cancelLiveSendBeat(true);
      return;
    }
    if (!driveIsHeld() && (state === 'recording' || state === 'sending' || state === 'thinking')) return;
    if (recording || recordingStarting || handsFreeCapture) return;
    let mode = '';
    let holdNotice = 'hold-start';
    if (driveIsHeld()) {
      mode = 'ptt';
      startRecording('drive');
    } else if (state === 'speaking') {
      if (handsFreeEnabled) {
        mode = 'live';
        bargeIn();
        holdNotice = '';
      } else if (interruptCurrentReply()) {
        mode = 'ptt';
        startRecording('drive');
        holdNotice = 'barge-in';
      }
    } else if (handsFreeEnabled && state === 'listening') {
      mode = 'live';
      startHandsFreeRecording(false);
    } else if (state === 'idle') {
      mode = 'ptt';
      startRecording('drive');
    }
    if (!mode) return;
    driveHold = {pointerID: event.pointerId, startX: event.clientX, startY: event.clientY, mode, cancelArmed: false, cancelZoneRect: null, locked: false, timer: 0};
    driveCircle.classList.add('drive-pressed');
    if (mode === 'ptt') showDriveLockHint(false);
    capturePointer(driveCircle, event.pointerId);
    if (holdNotice) localNotice(holdNotice);
    activateDriveAudio();
  });

  driveCircle.addEventListener('pointermove', event => {
    if (!driveHold || driveHold.pointerID !== event.pointerId) return;
    if (driveHold.mode === 'locked-send' || driveHold.locked) return;

    const downward = event.clientY - driveHold.startY;
    const upward = -downward;
    const decision = cancelDecision({upward, downward, horizontal, armed: driveHold.cancelArmed, released: false});
    if (driveHold.mode === 'ptt') {
      showDriveLockHint(upward >= DRIVE_HOLD_CANCEL_PX && upward >= horizontal);
      if (decision === 'lock') {
        driveHold.locked = true;
        showDriveCancelZone(false);
        setDriveLocked(true);
        return;
      }
    }
    if (decision === 'arm') {
      driveHold.cancelArmed = true;
      hideDriveLockHint();
      showDriveCancelZone(true);
      const rect = driveCancelZone.getBoundingClientRect();
      driveHold.cancelZoneRect = {left: rect.left, right: rect.right, top: rect.top, bottom: rect.bottom};
      localNotice('cancel-armed');
    } else if (decision === 'disarm') {
      driveHold.cancelArmed = false;
      driveHold.cancelZoneRect = null;
      showDriveCancelZone(false);
    }
  });

  function releaseDriveCircle(event, cancelled) {
    if (!driveHold || driveHold.pointerID !== event.pointerId) return;
    const hold = driveHold;
    driveHold = null;
    window.clearTimeout(hold.timer);
    driveCircle.classList.remove('drive-pressed');
    showDriveCancelZone(false);
    lastDriveReleaseAt = performance.now();
    if (!hold.locked) hideDriveLockHint();
    if (cancelled) {
      if (!hold.locked && hold.mode === 'ptt') preserveUnreleasedRecordingAsDraft(true);
      return;

    const horizontal = Math.abs(event.clientX - hold.startX);
    const downward = event.clientY - hold.startY;
    const upward = -downward;

      return;
    }
    if (hold.mode === 'locked-send') {
      setDriveLocked(false);
      if (recording && recording.source === 'drive') {
        if (!driveIsHeld()) localNotice('sending');
        stopRecording(false, driveIsHeld());
      } else if (recordingStarting) {
        if (!driveIsHeld()) localNotice('sending');
        drivePendingRecordingAction = driveIsHeld() ? 'refuse' : 'send';
      }
      return;
    }
    if (hold.locked || hold.mode !== 'ptt') return;
    if (recording && recording.source === 'drive') {
      if (!driveIsHeld()) localNotice('sending');
      stopRecording(false, driveIsHeld());
    } else if (recordingStarting) {
      if (!driveIsHeld()) localNotice('sending');
      drivePendingRecordingAction = driveIsHeld() ? 'refuse' : 'send';
    }
  }

  driveCircle.addEventListener('pointerup', event => releaseDriveCircle(event, false));
  driveCircle.addEventListener('pointercancel', event => releaseDriveCircle(event, true));
  driveCircle.addEventListener('click', event => {
    if (performance.now() - lastDriveReleaseAt <= DRIVE_CLICK_GUARD_MS) event.stopPropagation();
    event.preventDefault();
  });

  driveCancelButton.addEventListener('pointerdown', event => {
    if (event.button !== 0 || !event.isPrimary || currentView !== 'drive' || !driveLocked || lockedCancelHold) return;
    event.preventDefault();
    lockedCancelHold = {pointerID: event.pointerId, timer: 0};
    driveCancelButton.classList.add('holding');
    capturePointer(driveCancelButton, event.pointerId);
    localNotice('cancel-armed');
    lockedCancelHold.timer = window.setTimeout(() => {
      if (!lockedCancelHold || lockedCancelHold.pointerID !== event.pointerId) return;
      lockedCancelHold = null;
      driveCancelButton.classList.remove('holding');
      cancelDriveHoldRecording('recording-cancelled');
    }, DRIVE_LOCKED_CANCEL_MS);
  });

  function releaseLockedCancel(event) {
    if (!lockedCancelHold || lockedCancelHold.pointerID !== event.pointerId) return;
    const hold = lockedCancelHold;
    lockedCancelHold = null;
    window.clearTimeout(hold.timer);
    driveCancelButton.classList.remove('holding');
  }

  driveCancelButton.addEventListener('pointerup', releaseLockedCancel);
  driveCancelButton.addEventListener('pointercancel', releaseLockedCancel);
  driveCancelButton.addEventListener('click', event => event.preventDefault());

  driveLiveButton.addEventListener('pointerdown', event => {
    if (event.button !== 0 || !event.isPrimary || currentView !== 'drive' || liveHold || driveIsHeld()) return;
    if (state === 'recording' || state === 'sending' || state === 'thinking' || state === 'speaking') return;
    event.preventDefault();
    liveHold = {pointerID: event.pointerId, startX: event.clientX, startY: event.clientY, fired: false, timer: 0};
    capturePointer(driveLiveButton, event.pointerId);
    liveHold.timer = window.setTimeout(async () => {
      const hold = liveHold;
      if (!hold) return;
      hold.fired = true;
      if (handsFreeEnabled) {
        disableHandsFree();
        localNotice('live-off');
      } else {
        await activateDriveAudio();
        await enableHandsFree(driveMuted);
        if (handsFreeEnabled) localNotice('live-on');
      }
    }, DRIVE_LIVE_HOLD_MS);
  });

  driveLiveButton.addEventListener('pointermove', event => {
    if (!liveHold || liveHold.pointerID !== event.pointerId || liveHold.fired) return;
    if (Math.hypot(event.clientX - liveHold.startX, event.clientY - liveHold.startY) <= DRIVE_HOLD_CANCEL_PX) return;
    window.clearTimeout(liveHold.timer);
    liveHold = null;
  });

  function releaseDriveLive(event) {
    if (!liveHold || liveHold.pointerID !== event.pointerId) return;
    const hold = liveHold;
    liveHold = null;
    window.clearTimeout(hold.timer);
    if (!hold.fired) showDriveTranscriptNotice('hold to switch live', 2200);
  }

  driveLiveButton.addEventListener('pointerup', releaseDriveLive);
  driveLiveButton.addEventListener('pointercancel', releaseDriveLive);
  driveLiveButton.addEventListener('click', event => event.preventDefault());

  driveMuteButton.addEventListener('click', async () => {
    if (driveIsHeld() || state === 'recording') return;
    if (!driveMuted) {
      setDriveMuted(true);
      mutePlaybackNow();
      if (state === 'thinking') {
        resetReplyTracking();
        setState(handsFreeEnabled ? 'listening' : 'idle', true);
      }
      localNotice('muted');
      await changeVoicePreference(false, true);
    } else {
      setDriveMuted(false);
      await activateDriveAudio();
      localNotice('unmuted');
    }
  });

  driveReplayButton.addEventListener('click', async () => {
    if (driveIsHeld() || state === 'recording' || state === 'sending' || state === 'thinking') return;
    vibrate(15);
    replayLast();
  });

  driveReplyPlayButton.addEventListener('click', event => {
    event.stopPropagation();
    playMessageAudio(lastReplyMessageID, true, true);
  });

  driveDraftResend.addEventListener('click', resendDriveDraft);
  chatDraftResend.addEventListener('click', resendDriveDraft);
  driveDraftDiscard.addEventListener('click', discardDriveDraft);
  chatDraftDiscard.addEventListener('click', discardDriveDraft);

  driveChatButton.addEventListener('click', () => switchView('chat'));
  chatDriveButton.addEventListener('click', () => switchView('drive'));
  driveLastReply.addEventListener('click', () => switchView('chat'));
  driveChip.addEventListener('click', event => {
    event.stopPropagation();
    openPresenceSheet();
  });
  presenceSheetClose.addEventListener('click', closePresenceSheet);
  hapticsToggle.addEventListener('click', event => {
    event.stopPropagation();
    setHapticsEnabled(!hapticsEnabled);
  });
  presenceSheet.addEventListener('click', closePresenceSheet);
  presenceSheetBackdrop.addEventListener('click', event => {
    if (event.target === presenceSheetBackdrop) closePresenceSheet();
  });
  documentViewerClose.addEventListener('click', closeDocumentViewer);
  loadEarlierButton.addEventListener('click', loadEarlierHistory);
  newMessagesButton.addEventListener('click', scrollBottom);
  messages.addEventListener('scroll', () => {
    if (messages.scrollTop <= 1 && replayHistoryVisibleStart > 0) loadEarlierHistory();
    if (isNearMessageBottom()) newMessagesButton.hidden = true;
  });

  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && !documentViewer.hidden) {
      event.preventDefault();
      closeDocumentViewer();
      return;
    }
    if (event.key === 'Escape' && !presenceSheetBackdrop.hidden) {
      event.preventDefault();
      closePresenceSheet();
      return;
    }
    if (currentView === 'drive' && !driveMuteButton.contains(event.target)) activateDriveAudio();
    if (event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
    const target = event.target;
    if (target && (target.matches('input, textarea, [contenteditable="true"]'))) return;
    if (event.key === 'ArrowLeft') {
      event.preventDefault();
      switchView('drive');
      activateDriveAudio();
    } else if (event.key === 'ArrowRight') {
      event.preventDefault();
      switchView('chat');
    }
  });

  document.addEventListener('pointerdown', event => {
    if (!event.isPrimary || edgeSwipe) return;
    const width = document.documentElement.clientWidth;
    if (event.clientX <= VIEW_EDGE_START_PX) {
      edgeSwipe = {pointerID: event.pointerId, edge: 'left', startX: event.clientX, startY: event.clientY, cancelled: false};
    } else if (event.clientX >= width - VIEW_EDGE_START_PX) {
      edgeSwipe = {pointerID: event.pointerId, edge: 'right', startX: event.clientX, startY: event.clientY, cancelled: false};
    }
  }, true);

  document.addEventListener('pointermove', event => {
    if (!edgeSwipe || edgeSwipe.pointerID !== event.pointerId) return;
    if (Math.abs(event.clientY - edgeSwipe.startY) >= GESTURE_VERTICAL_CANCEL_PX) edgeSwipe.cancelled = true;
  }, true);

  function finishEdgeSwipe(event) {
    if (!edgeSwipe || edgeSwipe.pointerID !== event.pointerId) return;
    const swipe = edgeSwipe;
    edgeSwipe = null;
    if (swipe.cancelled) return;
    const distance = event.clientX - swipe.startX;
    if (swipe.edge === 'right' && distance <= -VIEW_SWIPE_DISTANCE_PX) switchView('chat');
    if (swipe.edge === 'left' && distance >= VIEW_SWIPE_DISTANCE_PX) switchView('drive');
  }

  document.addEventListener('pointerup', finishEdgeSwipe, true);
  document.addEventListener('pointercancel', () => { edgeSwipe = null; }, true);

  document.getElementById('logout').addEventListener('click', async () => {
    if (hasUnsentWork() && !window.confirm('You have an unsent voice note. Leave and lose it?')) return;
    const response = await fetch('/logout', {method: 'POST'});
    if (response.ok || response.status === 401) location.assign('/login');
  });
  window.addEventListener('beforeunload', event => {
    if (!hasUnsentWork()) return;
    event.preventDefault();
    event.returnValue = '';
  });
  window.addEventListener('pagehide', () => {
    preserveVoiceWorkOnHide();
  });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') {
      preserveVoiceWorkOnHide();
      stopVAD();
      return;
    }
    resumeAudioContext();
    startVAD();
    requestWakeLock();
  });
  if (window.isSecureContext && 'serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(error => {
      console.error('web: service worker registration failed', error);
    });
  }
  if (window.visualViewport) window.visualViewport.addEventListener('resize', scrollBottom);
  input.addEventListener('focus', scrollBottom);
  updateHandsFreeButton();
  updateReplayButtons();
  switchView(currentView, false);
  loadDriveDraft();
  connect();
  if (currentView === 'chat') input.focus({preventScroll: true});
})();
</script>
</body>
</html>
