<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="color-scheme" content="dark">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title>C3 web chat</title>
  <style>
    :root { color-scheme: dark; font: 17px/1.45 system-ui, sans-serif; background: #0b0d10; color: #f4f6f8; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; background: #0b0d10; }
    main { width: min(760px, 100%); min-height: 100dvh; margin: auto; display: grid; grid-template-rows: auto 1fr auto; }
    header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: .75rem; padding: .75rem 1rem; background: #11151a; border-bottom: 1px solid #2d333b; }
    h1 { min-width: 0; margin: 0; overflow: hidden; color: #f4f6f8; font-size: 1.05rem; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    #connection { min-width: 0; max-width: 10rem; overflow: hidden; color: #f2c94c; font-size: .88rem; text-decoration: none; text-overflow: ellipsis; white-space: nowrap; }
    #connection.connected { color: #77d68c; }
    #connection.detached { color: #9fb3c8; }
    #connection.disconnected { color: #ff6b6b; text-decoration: underline; }
    #hands-free-state { border: 1px solid #46515e; border-radius: 999px; padding: .22rem .55rem; color: #c5ced8; font-size: .76rem; white-space: nowrap; }
    #hands-free-state.state-listening { border-color: #77d68c; color: #77d68c; }
    #hands-free-state.state-recording { border-color: #ff6b6b; color: #ff9aa7; }
    #hands-free-state.state-sending, #hands-free-state.state-thinking { border-color: #f2c94c; color: #f2c94c; }
    #hands-free-state.state-speaking { border-color: #70b7ff; color: #70b7ff; }
    .header-control { min-width: 2.6rem; min-height: 2.6rem; border: 1px solid #46515e; border-radius: .55rem; padding: .3rem .5rem; background: #1a2027; color: #f4f6f8; font: inherit; flex: 0 0 auto; }
    .header-control:disabled { opacity: .45; }
    #logout { border: 0; padding: .25rem; background: transparent; color: #aeb8c4; text-decoration: underline; font: inherit; font-size: .82rem; flex: 0 0 auto; }
    #messages { min-height: 0; overflow-y: auto; padding: 1rem; scroll-padding-bottom: 9rem; }
    .message { max-width: 88%; margin: 0 0 1rem; padding: .72rem .85rem; border-radius: .9rem; background: #1a2027; box-shadow: 0 1px 0 #303842; }
    .message.mine { margin-left: auto; background: #173756; }
    .message.status { max-width: 100%; margin: .5rem 0 1rem; padding: .25rem .1rem; background: transparent; box-shadow: none; color: #aeb8c4; font-size: .9rem; }
    .message.interrupted { border: 1px solid #f2c94c; }
    .interruption { color: #f2c94c; }
    .body { overflow-wrap: anywhere; }
    .body.literal { white-space: pre-wrap; }
    .voice-label { display: block; font-weight: 700; }
    .voice-transcript { margin-top: .45rem; padding-top: .45rem; border-top: 1px solid #416786; white-space: pre-wrap; }
    .body p { margin: 0 0 .65rem; }
    .body p:last-child { margin-bottom: 0; }
    .body .heading { font-size: 1.08rem; font-weight: 700; }
    .body pre { margin: .4rem 0 .7rem; padding: .6rem; overflow-x: auto; border-radius: .4rem; background: #0c1014; color: #e6edf3; font: .9rem/1.45 ui-monospace, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
    .body code { padding: .08rem .25rem; border-radius: .25rem; background: #0c1014; color: #e6edf3; font: .9em ui-monospace, monospace; }
    .body pre code { padding: 0; background: transparent; font: inherit; }
    .body a { color: #70b7ff; text-decoration-thickness: .08em; text-underline-offset: .12em; }
    .body .spoiler { border-radius: .2rem; background: #d6dde5; color: transparent; text-shadow: 0 0 .45rem #050607; cursor: pointer; }
    .body .spoiler.revealed { background: transparent; color: inherit; text-shadow: none; cursor: text; }
    .body ul, .body ol { margin: .35rem 0 .7rem; padding-left: 1.55rem; }
    .body blockquote { margin: .35rem 0 .7rem; padding: .1rem .7rem; border-left: .22rem solid #596b7d; color: #c5ced8; }
    .body hr { height: 1px; margin: .75rem 0; border: 0; background: #46515e; }
    .table-scroll { max-width: 100%; margin: .4rem 0 .7rem; overflow-x: auto; }
    .body table { border-collapse: collapse; white-space: nowrap; }
    .body th, .body td { padding: .35rem .55rem; border: 1px solid #46515e; text-align: left; }
    .body th { background: #111820; }
    .meta { display: flex; gap: .45rem; margin-top: .3rem; color: #9ba7b4; font-size: .76rem; }
    .delivery.retrying { color: #f2c94c; }
    .delivery.failed { color: #ff6b6b; }
    #typing { min-height: 1.5rem; padding: 0 1rem .3rem; color: #aeb8c4; font-size: .88rem; }
    #voice-status { min-height: 1.35rem; padding: 0 1rem .35rem; color: #aeb8c4; font-size: .82rem; }
    form { position: sticky; bottom: 0; display: grid; grid-template-columns: 1fr auto auto; gap: .65rem; padding: .8rem max(.8rem, env(safe-area-inset-right)) max(.8rem, env(safe-area-inset-bottom)) max(.8rem, env(safe-area-inset-left)); background: #11151a; border-top: 1px solid #2d333b; }
    .compose-field { min-width: 0; }
    textarea { width: 100%; min-height: 3.25rem; max-height: 9rem; resize: none; border: 1px solid #46515e; border-radius: .65rem; padding: .72rem; background: #0b0d10; color: #fff; font: inherit; }
    textarea:focus { outline: 3px solid #2879c7; outline-offset: 1px; }
    #counter { display: block; margin-top: .15rem; color: #aeb8c4; font-size: .75rem; text-align: right; }
    #counter[hidden] { display: none; }
    #mic, #send { min-height: 3.25rem; border: 0; border-radius: .65rem; padding: .65rem 1rem; color: #fff; font: 700 1rem system-ui, sans-serif; }
    #mic { min-width: 4.5rem; background: #46515e; }
    #mic[aria-pressed="true"] { background: #b33b4a; }
    #mic:disabled { opacity: .65; }
    #send { min-width: 5.7rem; background: #2f8ad5; }
    #send:active { background: #246fae; }
    @media (max-width: 560px) {
      header { flex-wrap: wrap; gap: .4rem; padding-inline: .65rem; }
      h1 { font-size: .95rem; }
      #connection { max-width: 8rem; font-size: .76rem; flex: 1 1 5.5rem; }
      #hands-free-state { max-width: 6.8rem; overflow: hidden; text-overflow: ellipsis; }
      .header-control { min-width: 2.4rem; padding-inline: .35rem; font-size: .82rem; }
      #stop-audio, #replay-audio { font-size: 0; }
      #stop-audio::before { content: '■'; font-size: .82rem; }
      #replay-audio::before { content: '↻'; font-size: 1.1rem; }
      form { gap: .45rem; }
      #mic, #send { min-width: 3.8rem; padding-inline: .65rem; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <h1>C3 on-the-go chat</h1>
    <a id="connection" href="" role="status" aria-live="polite">reconnecting…</a>
    <span id="hands-free-state" class="state-idle" aria-live="polite">○ idle</span>
    <button id="voice-toggle" class="header-control" type="button" aria-label="Spoken replies" aria-pressed="false">🔇</button>
    <button id="hands-free-toggle" class="header-control" type="button" aria-label="Hands-free" aria-pressed="false">🎙</button>
    <button id="stop-audio" class="header-control" type="button" aria-label="Stop spoken reply" hidden>Stop</button>
    <button id="replay-audio" class="header-control" type="button" aria-label="Replay last spoken reply" disabled>Replay</button>
    <button id="logout" type="button">logout</button>
  </header>
  <section id="messages" aria-live="polite" aria-label="Conversation"></section>
  <div>
    <div id="typing" aria-live="polite"></div>
    <div id="voice-status" aria-live="polite"></div>
    <form id="composer">
      <div class="compose-field">
        <textarea id="text" aria-label="Message" placeholder="Message the attached session" maxlength="16000" required></textarea>
        <span id="counter" aria-live="polite" hidden></span>
      </div>
      <button id="mic" type="button" aria-label="Record voice note" aria-pressed="false">🎤</button>
      <button id="send" type="submit">Send</button>
    </form>
  </div>
</main>
<script>
(() => {
  // VAD samples the live microphone every 50 ms.
  const VAD_SAMPLE_MS = 50;
  // The AnalyserNode uses 1024 samples per time-domain block.
  const VAD_FFT_SIZE = 1024;
  // The idle noise floor follows ambient sound with a roughly three-second EMA.
  const VAD_NOISE_ALPHA = 0.015;
  // The adaptive noise floor starts at a conservative RMS value.
  const VAD_INITIAL_FLOOR = 0.01;
  // Speech must exceed 2.5 times the ambient floor to start.
  const VAD_START_FLOOR_MULTIPLIER = 2.5;
  // Speech start has a fixed RMS floor for quiet rooms.
  const VAD_START_MIN_RMS = 0.012;
  // Two consecutive positive blocks make the 100 ms start vote.
  const VAD_START_SAMPLES = 2;
  // Speech end uses 1.8 times the frozen ambient floor.
  const VAD_END_FLOOR_MULTIPLIER = 1.8;
  // Speech end has a fixed RMS floor for quiet rooms.
  const VAD_END_MIN_RMS = 0.008;
  // Nine hundred milliseconds below threshold ends an utterance.
  const VAD_HANGOVER_MS = 900;
  // Ambient-floor learning remains frozen for one second after hangover.
  const VAD_FLOOR_FREEZE_MS = 1000;
  // Speech shorter than 280 ms is discarded without a message.
  const VAD_MIN_UTTERANCE_MS = 280;
  // A hands-free utterance is capped at 60 seconds.
  const VAD_MAX_UTTERANCE_MS = 60000;
  // The recorder input is delayed by 300 ms to retain pre-roll.
  const VAD_PRE_ROLL_SECONDS = 0.3;
  // Recording continues for 300 ms after hangover completes.
  const VAD_RECORDER_STOP_DELAY_MS = 300;
  // Speech-band spectral flatness must stay below this noise rejection vote.
  const VAD_MAX_FLATNESS = 0.45;
  // VAD energy excludes frequencies below the speech band.
  const VAD_LOW_HZ = 300;
  // VAD energy excludes frequencies above the speech band.
  const VAD_HIGH_HZ = 3400;
  // Barge-in ignores the first 400 ms of synthesized playback.
  const BARGE_IGNORE_MS = 400;
  // Playback-floor sampling reacts quickly during the short calibration window.
  const BARGE_FLOOR_ALPHA = 0.2;
  // Barge-in energy must exceed eight times the sampled playback floor.
  const BARGE_FLOOR_MULTIPLIER = 8;
  // Barge-in has a high fixed RMS floor to reject loudspeaker leakage.
  const BARGE_MIN_RMS = 0.07;
  // Four hundred milliseconds over threshold confirms a barge-in.
  const BARGE_REQUIRED_MS = 400;
  // The first 200 ms after barge-in is muted from the captured audio.
  const BARGE_DROP_MS = 200;
  // Earcons use a deliberately low gain.
  const EARCON_GAIN = 0.15;
  // The listening-armed earcon is an 880 Hz tone.
  const EARCON_ARM_HZ = 880;
  // The listening-armed earcon lasts 80 ms.
  const EARCON_ARM_MS = 80;
  // The captured earcon begins at 660 Hz.
  const EARCON_SEND_LOW_HZ = 660;
  // The captured earcon rises to 880 Hz.
  const EARCON_SEND_HIGH_HZ = 880;
  // Each captured-earcon tone lasts 60 ms.
  const EARCON_SEND_TONE_MS = 60;
  // The error earcon uses a low 220 Hz tone.
  const EARCON_ERROR_HZ = 220;
  // The error earcon lasts 150 ms.
  const EARCON_ERROR_MS = 150;
  // VAD analysis pauses for 200 ms after every audible earcon finishes.
  const EARCON_ANALYSIS_MUTE_MS = 200;
  // An accepted utterance waits at most 90 seconds for its own reply.
  const REPLY_TIMEOUT_MS = 90000;
  // A delivered reply waits ten seconds for synthesized audio.
  const REPLY_AUDIO_WAIT_MS = 10000;
  // All hands-free upload attempts share one 60-second deadline.
  const HANDS_FREE_UPLOAD_TIMEOUT_MS = 60000;
  // Earcons ramp up over five milliseconds to avoid an audible click.
  const EARCON_ATTACK_MS = 5;

  const messages = document.getElementById('messages');
  const composer = document.getElementById('composer');
  const input = document.getElementById('text');
  const connection = document.getElementById('connection');
  const typing = document.getElementById('typing');
  const counter = document.getElementById('counter');
  const voiceStatus = document.getElementById('voice-status');
  const micButton = document.getElementById('mic');
  const voiceButton = document.getElementById('voice-toggle');
  const handsFreeButton = document.getElementById('hands-free-toggle');
  const handsFreeState = document.getElementById('hands-free-state');
  const stopAudioButton = document.getElementById('stop-audio');
  const replayAudioButton = document.getElementById('replay-audio');
  const rows = new Map();
  const pendingRows = new Map();
  let typingTimer;
  let voiceStatusTimer;
  let detached = false;
  let connectionText = 'reconnecting…';
  let connectionClass = '';
  let handsFreeEnabled = false;
  let state = 'idle';

  const stateLabels = {
    idle: '○ idle',
    listening: '◉ listening',
    recording: '● recording',
    sending: '↑ sending',
    thinking: '… thinking',
    speaking: '🔊 speaking'
  };

  function renderConnection() {
    connection.textContent = connectionText;
    connection.className = connectionClass;
  }

  function setState(next, quiet) {
    if (!stateLabels[next]) return;
    const previous = state;
    state = next;
    handsFreeState.textContent = stateLabels[state];
    handsFreeState.className = 'state-' + state;
    renderConnection();
    if (!handsFreeEnabled || previous === state || quiet) return;
    if (state === 'listening') playEarcon('armed');
    if (state === 'sending') playEarcon('sending');
  }

  function setConnection(text, className) {
    connectionText = text;
    connectionClass = className || '';
    renderConnection();
  }

  function setVoiceStatus(text, quietTime) {
    window.clearTimeout(voiceStatusTimer);
    voiceStatus.textContent = text || '';
    if (text && quietTime) {
      voiceStatusTimer = window.setTimeout(() => { voiceStatus.textContent = ''; }, quietTime);
    }
  }

  function scrollBottom() {
    requestAnimationFrame(() => { messages.scrollTop = messages.scrollHeight; });
  }

  function renderText(node, text) {
    function renderLiteral(node, text) {
      node.textContent = String(text);
      node.classList.add('literal');
    }

    try {
      node.textContent = '';
      node.classList.remove('literal');
      const lines = String(text).split('\n');
      let index = 0;

    function appendLink(parent, label, href) {
      const separator = href.indexOf(':');
      const scheme = separator < 0 ? '' : href.slice(0, separator + 1).toLowerCase();
      const allowedSchemes = ['http:', 'https:', 'mailto:', 'tel:'];
      if (!allowedSchemes.includes(scheme)) return false;
      const link = document.createElement('a');
      link.setAttribute('href', href);
      link.setAttribute('rel', 'noopener noreferrer');
      link.setAttribute('target', '_blank');
      link.textContent = label;
      parent.append(link);
      return true;
    }

    function appendInline(parent, source) {
      const pattern = /(`[^`\n]+`|\[[^\]\n]+\]\([^\s)]+\)|https?:\/\/[^\s<]+|\|\|[^|\n]+\|\||\*\*[^*\n]+\*\*|(?<![A-Za-z0-9])__[^_\n]+__(?![A-Za-z0-9])|~~[^~\n]+~~|\*[^*\n]+\*|(?<![A-Za-z0-9])_[^_\n]+_(?![A-Za-z0-9]))/gi;
      let offset = 0;
      for (const match of source.matchAll(pattern)) {
        if (match.index > offset) parent.append(document.createTextNode(source.slice(offset, match.index)));
        const token = match[0];
        const markdownLink = token.match(/^\[([^\]\n]+)\]\(([^\s)]+)\)$/);
        if (token.startsWith('`')) {
          const code = document.createElement('code');
          code.textContent = token.slice(1, -1);
          parent.append(code);
        } else if (markdownLink) {
          if (!appendLink(parent, markdownLink[1], markdownLink[2])) parent.append(document.createTextNode(token));
        } else if (/^https?:\/\//i.test(token)) {
          let href = token;
          let suffix = '';
          while (/[.,!?;:)]$/.test(href)) {
            suffix = href.slice(-1) + suffix;
            href = href.slice(0, -1);
          }
          appendLink(parent, href, href);
          if (suffix) parent.append(document.createTextNode(suffix));
        } else if (token.startsWith('||')) {
          const spoiler = document.createElement('span');
          spoiler.className = 'spoiler';
          spoiler.setAttribute('tabindex', '0');
          spoiler.setAttribute('role', 'button');
          spoiler.setAttribute('aria-label', 'spoiler');
          spoiler.textContent = token.slice(2, -2);
          const reveal = () => { spoiler.classList.add('revealed'); };
          spoiler.addEventListener('click', reveal);
          spoiler.addEventListener('keydown', event => {
            if (event.key !== 'Enter' && event.key !== ' ') return;
            event.preventDefault();
            reveal();
          });
          parent.append(spoiler);
        } else {
          const element = document.createElement(token.startsWith('**') || token.startsWith('__') ? 'strong' : token.startsWith('~~') ? 's' : 'em');
          appendInline(element, token.slice(token.startsWith('**') || token.startsWith('__') || token.startsWith('~~') ? 2 : 1, token.startsWith('**') || token.startsWith('__') || token.startsWith('~~') ? -2 : -1));
          parent.append(element);
        }
        offset = match.index + token.length;
      }
      if (offset < source.length) parent.append(document.createTextNode(source.slice(offset)));
    }

    function appendLines(parent, blockLines) {
      blockLines.forEach((line, lineIndex) => {
        if (lineIndex) parent.append(document.createElement('br'));
        appendInline(parent, line);
      });
    }

    function tableCells(line) {
      const value = line.trim();
      const cells = [];
      let cell = '';
      let hasSeparator = false;
      let trailingSeparator = false;
      for (let cellIndex = 0; cellIndex < value.length; cellIndex += 1) {
        if (value[cellIndex] === '\\' && value[cellIndex + 1] === '|') {
          cell += '|';
          cellIndex += 1;
          trailingSeparator = false;
        } else if (value[cellIndex] === '|') {
          cells.push(cell.trim());
          cell = '';
          hasSeparator = true;
          trailingSeparator = true;
        } else {
          cell += value[cellIndex];
          trailingSeparator = false;
        }
      }
      cells.push(cell.trim());
      if (!hasSeparator) return null;
      if (value.startsWith('|')) cells.shift();
      if (trailingSeparator) cells.pop();
      return cells;
    }

    function isTable(at) {
      if (at + 1 >= lines.length) return false;
      const header = tableCells(lines[at]);
      const separator = tableCells(lines[at + 1]);
      return header && separator && header.length === separator.length && separator.every(cell => /^:?-{1,}:?$/.test(cell));
    }

    function isBlockStart(at) {
      const line = lines[at];
      return /^```/.test(line) || /^#{1,6}\s+/.test(line) || /^[-*+]\s+/.test(line) || /^\d+\.\s+/.test(line) || /^>\s?/.test(line) || /^(---|\*\*\*)\s*$/.test(line) || isTable(at);
    }

    while (index < lines.length) {
      if (!lines[index].trim()) {
        index += 1;
        continue;
      }

      const fence = lines[index].match(/^```\s*([A-Za-z0-9_+-]*)\s*$/);
      if (fence) {
        index += 1;
        const codeLines = [];
        while (index < lines.length && !/^```\s*$/.test(lines[index])) {
          codeLines.push(lines[index]);
          index += 1;
        }
        if (index < lines.length) index += 1;
        const pre = document.createElement('pre');
        const code = document.createElement('code');
        code.textContent = codeLines.join('\n');
        if (fence[1]) code.setAttribute('data-language', fence[1]);
        pre.append(code);
        node.append(pre);
        continue;
      }

      if (isTable(index)) {
        const header = tableCells(lines[index]);
        index += 2;
        const wrapper = document.createElement('div');
        wrapper.className = 'table-scroll';
        const table = document.createElement('table');
        const head = document.createElement('thead');
        const headRow = document.createElement('tr');
        header.forEach(value => {
          const cell = document.createElement('th');
          appendInline(cell, value);
          headRow.append(cell);
        });
        head.append(headRow);
        table.append(head);
        const body = document.createElement('tbody');
        while (index < lines.length && lines[index].trim()) {
          const values = tableCells(lines[index]);
          if (!values) break;
          const row = document.createElement('tr');
          header.forEach((_, cellIndex) => {
            const cell = document.createElement('td');
            appendInline(cell, values[cellIndex] || '');
            row.append(cell);
          });
          body.append(row);
          index += 1;
        }
        table.append(body);
        wrapper.append(table);
        node.append(wrapper);
        continue;
      }

      const heading = lines[index].match(/^#{1,6}\s+(.+)$/);
      if (heading) {
        const paragraph = document.createElement('p');
        paragraph.className = 'heading';
        appendInline(paragraph, heading[1]);
        node.append(paragraph);
        index += 1;
        continue;
      }

      if (/^(---|\*\*\*)\s*$/.test(lines[index])) {
        node.append(document.createElement('hr'));
        index += 1;
        continue;
      }

      const bullet = lines[index].match(/^[-*+]\s+(.+)$/);
      if (bullet) {
        const list = document.createElement('ul');
        while (index < lines.length) {
          const itemMatch = lines[index].match(/^[-*+]\s+(.+)$/);
          if (!itemMatch) break;
          const item = document.createElement('li');
          appendInline(item, itemMatch[1]);
          list.append(item);
          index += 1;
        }
        node.append(list);
        continue;
      }

      const numbered = lines[index].match(/^(\d+)\.\s+(.+)$/);
      if (numbered) {
        const list = document.createElement('ol');
        list.setAttribute('start', numbered[1]);
        while (index < lines.length) {
          const itemMatch = lines[index].match(/^\d+\.\s+(.+)$/);
          if (!itemMatch) break;
          const item = document.createElement('li');
          appendInline(item, itemMatch[1]);
          list.append(item);
          index += 1;
        }
        node.append(list);
        continue;
      }

      if (/^>\s?/.test(lines[index])) {
        const quote = document.createElement('blockquote');
        const quoteLines = [];
        while (index < lines.length && /^>\s?/.test(lines[index])) {
          quoteLines.push(lines[index].replace(/^>\s?/, ''));
          index += 1;
        }
        appendLines(quote, quoteLines);
        node.append(quote);
        continue;
      }

      const paragraphLines = [];
      while (index < lines.length && lines[index].trim() && (!paragraphLines.length || !isBlockStart(index))) {
        paragraphLines.push(lines[index]);
        index += 1;
      }
      const paragraph = document.createElement('p');
      appendLines(paragraph, paragraphLines);
      node.append(paragraph);
    }
    } catch (error) {
      console.error('web: markdown render failed', error);
      renderLiteral(node, text);
    }
  }

  function renderLiteral(node, text) {
    node.textContent = String(text);
    node.classList.add('literal');
  }

  function formatDuration(seconds) {
    const whole = Math.max(0, Math.round(Number(seconds) || 0));
    return Math.floor(whole / 60) + ':' + String(whole % 60).padStart(2, '0');
  }

  function renderVoice(node, data) {

  function addMessage(kind, data, deliveryText) {
    const id = Number(data.message_id || 0);
    const key = rowKey(kind, id);
    if (id && rows.has(key)) return rows.get(key);

    else if (kind === 'mine' && data.voice) renderVoice(body, data);

    meta.className = 'meta';
    const timestamp = document.createElement('time');
    timestamp.textContent = new Date(data.timestamp || Date.now()).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
    meta.append(timestamp);

      delivery.className = 'delivery';
      delivery.textContent = deliveryText;
      meta.append(delivery);
      row.delivery = delivery;
    }
    row.append(body, meta);
    row.bodyNode = body;
    row.metaNode = meta;

    row.voiceDuration = Number(data.duration_seconds || 0);

  function setDelivery(row, text, state) {
    if (!row.delivery) return;
    row.delivery.textContent = text;
    row.delivery.className = 'delivery ' + (state || '');

  function recordMessageID(row, kind, id) {
    if (!id) return;
    row.dataset.messageId = String(id);
    rows.set(rowKey(kind, id), row);
  }

  function clientID() {
    if (crypto.randomUUID) return crypto.randomUUID();
    const values = crypto.getRandomValues(new Uint32Array(4));
    return Array.from(values, value => value.toString(16)).join('-');
  }

  async function deliver(pending) {
    setDelivery(pending.row, pending.attempt ? 'not delivered — retrying' : 'sending', pending.attempt ? 'retrying' : '');
    try {
      const controller = new AbortController();
      const timeout = window.setTimeout(() => controller.abort(), 15000);
      let response;
      try {
        response = await fetch('/send', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({text: pending.text, client_id: pending.clientID}),
          signal: controller.signal
        });
      } finally {
        window.clearTimeout(timeout);
      }
      if (response.status === 202) {
        const result = await response.json();
        const id = Number(result.message_id || 0);
        recordMessageID(pending.row, 'mine', id);
        pendingRows.delete(pending.clientID);
        setDelivery(pending.row, 'sent', '');
        return;
      }
      if (response.status === 503) throw new Error('retry');
      let reason = 'request failed';
      try {
        const result = await response.json();
        if (result.error) reason = result.error;
      } catch (_) {
        if (response.status === 401) reason = 'sign in again';
      }
      pendingRows.delete(pending.clientID);
      setDelivery(pending.row, 'not sent — ' + reason, 'failed');
      return;
    } catch (_) {
      pending.attempt += 1;
      const delay = Math.min(30000, 2000 * Math.pow(2, pending.attempt - 1));
      setDelivery(pending.row, 'not delivered — retrying', 'retrying');
      window.setTimeout(() => deliver(pending), delay);
    }
  }

  function finishVoiceUpload() {
    micButton.disabled = handsFreeEnabled;
    micButton.setAttribute('aria-pressed', 'false');
    micButton.textContent = '🎤';

  function settleVoiceUpload(pending) {
    if (pending.settled) return false;
    pending.settled = true;
    window.clearTimeout(pending.handsFreeDeadline);
    pending.handsFreeDeadline = 0;
    return true;
  }

  function failVoiceUpload(pending, reason) {
    if (!settleVoiceUpload(pending)) return;
    pendingRows.delete(pending.clientID);
    setDelivery(pending.row, 'not sent — ' + reason, 'failed');
    finishVoiceUpload();
    if (pending.handsFree) handsFreeUploadFailed(pending.clientID);
  }

  function startHandsFreeUploadDeadline(pending) {
    if (!pending.handsFree || pending.handsFreeDeadline) return;
    pending.handsFreeDeadline = window.setTimeout(() => {
      if (pending.controller) pending.controller.abort();
      failVoiceUpload(pending, 'upload timed out');
    }, HANDS_FREE_UPLOAD_TIMEOUT_MS);
  }

  async function deliverVoice(pending) {
    if (pending.settled) return;
    startHandsFreeUploadDeadline(pending);
    setDelivery(pending.row, pending.attempt ? 'not delivered — retrying' : 'sending', pending.attempt ? 'retrying' : '');
    micButton.disabled = true;
    micButton.setAttribute('aria-pressed', 'false');
    micButton.textContent = 'uploading…';
    const controller = new AbortController();
    pending.controller = controller;
    const attemptTimeout = pending.handsFree ? 0 : window.setTimeout(() => controller.abort(), 60000);
    try {
      const response = await fetch('/voice-note', {
        method: 'POST',
        headers: {'Content-Type': pending.mimeType, 'X-Client-Id': pending.clientID},
        body: pending.blob,
        signal: controller.signal
      });
      if (response.status === 202) {
        const result = await response.json();
        if (!settleVoiceUpload(pending)) return;
        const messageID = Number(result.message_id || 0);
        recordMessageID(pending.row, 'mine', messageID);
        pendingRows.delete(pending.clientID);
        setDelivery(pending.row, 'sent', '');
        finishVoiceUpload();
        if (pending.handsFree) handsFreeUploadAccepted(pending.clientID, messageID);
        return;
      }
      if (response.status === 503) throw new Error('retry');
      let reason = 'request failed';
      try {
        const result = await response.json();
        if (result.error) reason = result.error;
      } catch (_) {
        if (response.status === 401) reason = 'sign in again';
      }
      failVoiceUpload(pending, reason);
    } catch (_) {
      if (pending.settled) return;
      pending.attempt += 1;
      const delay = Math.min(30000, 2000 * Math.pow(2, pending.attempt - 1));
      setDelivery(pending.row, 'not delivered — retrying', 'retrying');
      window.setTimeout(() => deliverVoice(pending), delay);
    } finally {
      window.clearTimeout(attemptTimeout);
      if (pending.controller === controller) pending.controller = null;
    }
  }

  let recording;
  let recordingStarting = false;

  function recorderMimeType() {
    const choices = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'];
    if (!MediaRecorder.isTypeSupported) return '';
    return choices.find(type => MediaRecorder.isTypeSupported(type)) || '';
  }

  function stopRecording() {
    if (!recording || recording.recorder.state === 'inactive') return;
    window.clearTimeout(recording.autoStop);
    window.clearInterval(recording.clock);
    recording.recorder.stop();
    micButton.setAttribute('aria-pressed', 'false');
    micButton.disabled = true;
    micButton.textContent = 'uploading…';
  }

  async function startRecording() {
    if (recordingStarting) return;
    recordingStarting = true;
    micButton.disabled = true;
    handsFreeButton.disabled = true;
    setVoiceStatus('');
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({audio: {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true
      }});
      const mimeType = recorderMimeType();
      const recorder = mimeType ? new MediaRecorder(stream, {mimeType}) : new MediaRecorder(stream);
      const started = performance.now();
      const capture = {recorder, stream, started, chunks: [], failed: false};
      recording = capture;
      recorder.addEventListener('dataavailable', event => {
        if (event.data && event.data.size) capture.chunks.push(event.data);
      });
      recorder.addEventListener('stop', () => {
        if (recording === capture) recording = null;
        capture.stream.getTracks().forEach(track => track.stop());
        if (capture.failed) return;
        const milliseconds = performance.now() - capture.started;
        if (milliseconds < 400) {
          finishVoiceUpload();
          setVoiceStatus('too short', 3000);
          return;
        }
        const actualType = capture.recorder.mimeType || (capture.chunks[0] && capture.chunks[0].type) || 'audio/webm';
        const blob = new Blob(capture.chunks, {type: actualType});
        const duration = milliseconds / 1000;
        const row = addMessage('mine', {
          voice: true, duration_seconds: duration, timestamp: new Date().toISOString()
        }, 'sending');
        const id = clientID();
        pendingRows.set(id, row);
        deliverVoice({blob, mimeType: actualType, clientID: id, row, attempt: 0});
      }, {once: true});
      recorder.addEventListener('error', () => {
        capture.failed = true;
        capture.stream.getTracks().forEach(track => track.stop());
        if (recording === capture) recording = null;
        finishVoiceUpload();
        setVoiceStatus('microphone recording failed', 4000);
      }, {once: true});
      recorder.start();
      recordingStarting = false;
      micButton.disabled = false;
      micButton.setAttribute('aria-pressed', 'true');
      micButton.textContent = '● 0:00';
      recording.clock = window.setInterval(() => {
        if (recording) micButton.textContent = '● ' + formatDuration((performance.now() - recording.started) / 1000);
      }, 250);
      recording.autoStop = window.setTimeout(stopRecording, 5 * 60 * 1000);
    } catch (_) {
      if (stream) stream.getTracks().forEach(track => track.stop());
      recording = null;
      recordingStarting = false;
      finishVoiceUpload();
      setVoiceStatus('microphone unavailable — check browser permission', 5000);
    }
  }

  micButton.addEventListener('click', () => {
    if (recording) stopRecording();

  const player = document.createElement('audio');

  player.hidden = true;
  document.body.append(player);
  const audioQueue = [];
  const audioHistory = [];
  const ignoredAudioReplyIDs = [];
  let currentAudio;
  let voiceEnabled = false;
  let audioUnlocked = false;
  let unlockingAudio = false;
  let audioContext;
  let microphoneStream;
  let microphoneSource;
  let analyser;
  let recordingDelay;
  let recordingGain;
  let recordingDestination;
  let vadTimeData;
  let vadFrequencyData;
  let vadTimer;
  let noiseFloor = VAD_INITIAL_FLOOR;
  let floorFrozenUntil = 0;
  let startVotes = 0;
  let handsFreeCapture;
  let handsFreeStarting = false;
  let analysisMutedUntil = 0;
  let speakingStartedAt = 0;
  let playbackFloor = VAD_INITIAL_FLOOR;
  let bargeAboveMilliseconds = 0;
  let suppressPlaybackPauseUntil = 0;

  function createAudioContext() {
    if (audioContext) return audioContext;
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) throw new Error('Web Audio unavailable');
    audioContext = new AudioContextClass();
    audioContext.addEventListener('statechange', resumeAudioContext);
    return audioContext;
  }

  function resumeAudioContext() {
    if (!audioContext || audioContext.state !== 'suspended' || document.visibilityState !== 'visible') return;
    if (!handsFreeEnabled && !voiceEnabled && state !== 'speaking') return;
    audioContext.resume().catch(() => {});
  }

  function playEarcon(kind) {
    if (!audioContext || state === 'speaking') return;
    audioContext.resume().catch(() => {});
    const tones = kind === 'armed' ? [[EARCON_ARM_HZ, EARCON_ARM_MS]] :
      kind === 'sending' ? [[EARCON_SEND_LOW_HZ, EARCON_SEND_TONE_MS], [EARCON_SEND_HIGH_HZ, EARCON_SEND_TONE_MS]] :
      [[EARCON_ERROR_HZ, EARCON_ERROR_MS]];
    let begins = audioContext.currentTime + 0.01;
    tones.forEach(([frequency, milliseconds]) => {
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      const ends = begins + milliseconds / 1000;
      oscillator.frequency.value = frequency;
      gain.gain.setValueAtTime(0.0001, begins);
      gain.gain.linearRampToValueAtTime(EARCON_GAIN, begins + EARCON_ATTACK_MS / 1000);
      gain.gain.exponentialRampToValueAtTime(0.0001, ends);
      oscillator.connect(gain);
      gain.connect(audioContext.destination);
      oscillator.start(begins);
      oscillator.stop(ends);
      begins = ends;
    });
    analysisMutedUntil = performance.now() + (begins - audioContext.currentTime) * 1000 + EARCON_ANALYSIS_MUTE_MS;
  }

  function connectMicrophoneGraph(stream) {
    const context = createAudioContext();
    microphoneSource = context.createMediaStreamSource(stream);
    analyser = context.createAnalyser();
    analyser.fftSize = VAD_FFT_SIZE;
    analyser.smoothingTimeConstant = 0;
    recordingDelay = context.createDelay(1);
    recordingDelay.delayTime.value = VAD_PRE_ROLL_SECONDS;
    recordingGain = context.createGain();
    recordingDestination = context.createMediaStreamDestination();
    microphoneSource.connect(analyser);
    microphoneSource.connect(recordingDelay);
    recordingDelay.connect(recordingGain);
    recordingGain.connect(recordingDestination);
    vadTimeData = new Float32Array(analyser.fftSize);
    vadFrequencyData = new Float32Array(analyser.frequencyBinCount);
  }

  function releaseMicrophone() {
    stopVAD();
    if (microphoneSource) microphoneSource.disconnect();
    if (recordingDelay) recordingDelay.disconnect();
    if (recordingGain) recordingGain.disconnect();
    if (microphoneStream) microphoneStream.getTracks().forEach(track => track.stop());
    microphoneStream = null;
    microphoneSource = null;
    analyser = null;
    recordingDelay = null;
    recordingGain = null;
    recordingDestination = null;
    vadTimeData = null;
    vadFrequencyData = null;
  }

  // Estimate speech-band RMS by weighting centered time-domain RMS with the
  // square root of the 300–3400 Hz FFT-power fraction; thresholds stay in RMS units.
  function estimateSpeechEnergy() {
    analyser.getFloatTimeDomainData(vadTimeData);
    let mean = 0;
    for (const sample of vadTimeData) mean += sample;
    mean /= vadTimeData.length;
    let timePower = 0;
    for (const sample of vadTimeData) {
      const centered = sample - mean;
      timePower += centered * centered;
    }
    const timeRMS = Math.sqrt(timePower / vadTimeData.length);

    analyser.getFloatFrequencyData(vadFrequencyData);
    const hertzPerBin = audioContext.sampleRate / analyser.fftSize;
    const firstBin = Math.max(1, Math.ceil(VAD_LOW_HZ / hertzPerBin));
    const lastBin = Math.min(vadFrequencyData.length - 1, Math.floor(VAD_HIGH_HZ / hertzPerBin));
    let allPower = 0;
    let bandPower = 0;
    let bandLogPower = 0;
    let bandBins = 0;
    for (let index = 1; index < vadFrequencyData.length; index += 1) {
      const decibels = vadFrequencyData[index];
      const power = Number.isFinite(decibels) ? Math.pow(10, decibels / 10) : 0;
      allPower += power;
      if (index < firstBin || index > lastBin) continue;
      bandPower += power;
      bandLogPower += Math.log(Math.max(power, 1e-12));
      bandBins += 1;
    }
    const bandRatio = allPower > 0 ? Math.sqrt(bandPower / allPower) : 0;
    const arithmeticMean = bandBins ? bandPower / bandBins : 0;
    const flatness = arithmeticMean > 0 ? Math.exp(bandLogPower / bandBins) / arithmeticMean : 1;
    return {rms: timeRMS * bandRatio, flatness};
  }

  function startVAD() {
    if (vadTimer || !handsFreeEnabled || !analyser || document.visibilityState === 'hidden') return;
    vadTimer = window.setInterval(sampleVAD, VAD_SAMPLE_MS);
  }

  function stopVAD() {
    window.clearInterval(vadTimer);
    vadTimer = null;
  }

  function sampleVAD() {
    if (!handsFreeEnabled || !analyser || performance.now() < analysisMutedUntil) return;
    const now = performance.now();
    const energy = estimateSpeechEnergy();
    if (state === 'listening') {
      const threshold = Math.max(noiseFloor * VAD_START_FLOOR_MULTIPLIER, VAD_START_MIN_RMS);
      const isSpeech = energy.rms > threshold && energy.flatness < VAD_MAX_FLATNESS;
      startVotes = isSpeech ? startVotes + 1 : 0;
      if (startVotes >= VAD_START_SAMPLES) {
        startVotes = 0;
        startHandsFreeRecording(false);
        return;
      }
      if (now >= floorFrozenUntil) {
        noiseFloor += VAD_NOISE_ALPHA * (energy.rms - noiseFloor);
      }
      return;
    }
    if (state === 'recording' && handsFreeCapture && !handsFreeCapture.finishing) {
      const threshold = Math.max(noiseFloor * VAD_END_FLOOR_MULTIPLIER, VAD_END_MIN_RMS);
      if (energy.rms >= threshold) {
        handsFreeCapture.belowSince = 0;
        handsFreeCapture.lastSpeechAt = now;
      } else if (!handsFreeCapture.belowSince) {
        handsFreeCapture.belowSince = now;
      } else if (now - handsFreeCapture.belowSince >= VAD_HANGOVER_MS) {
        floorFrozenUntil = now + VAD_FLOOR_FREEZE_MS;
        finishHandsFreeRecording(false, VAD_RECORDER_STOP_DELAY_MS);
      }
      if (now - handsFreeCapture.started >= VAD_MAX_UTTERANCE_MS) {
        finishHandsFreeRecording(true, VAD_RECORDER_STOP_DELAY_MS);
      }
      return;
    }
    if (state !== 'speaking') return;
    const speakingMilliseconds = now - speakingStartedAt;
    if (speakingMilliseconds < BARGE_IGNORE_MS) {
      playbackFloor += BARGE_FLOOR_ALPHA * (energy.rms - playbackFloor);
      return;
    }
    const threshold = Math.max(playbackFloor * BARGE_FLOOR_MULTIPLIER, BARGE_MIN_RMS);
    bargeAboveMilliseconds = energy.rms > threshold ? bargeAboveMilliseconds + VAD_SAMPLE_MS : 0;
    if (bargeAboveMilliseconds >= BARGE_REQUIRED_MS) bargeIn();
  }

  function startHandsFreeRecording(isBargeIn) {
    if (!handsFreeEnabled || handsFreeCapture || !recordingDestination) return;
    let recorder;
    try {
      const mimeType = recorderMimeType();
      recorder = mimeType ? new MediaRecorder(recordingDestination.stream, {mimeType}) : new MediaRecorder(recordingDestination.stream);
    } catch (_) {
      setState('listening', true);
      playEarcon('error');
      setVoiceStatus('microphone recording failed', 4000);
      return;
    }
    const started = performance.now();
    const capture = {
      recorder,
      started,
      speechStarted: started - (VAD_START_SAMPLES - 1) * VAD_SAMPLE_MS,
      lastSpeechAt: started,
      belowSince: 0,
      chunks: [],
      finishing: false,
      forceUpload: false,
      discard: false,
      failed: false,
      unmuteTimer: 0,
      stopTimer: 0
    };
    handsFreeCapture = capture;
    recorder.addEventListener('dataavailable', event => {
      if (event.data && event.data.size) capture.chunks.push(event.data);
    });
    recorder.addEventListener('error', () => {
      capture.failed = true;
      if (handsFreeCapture === capture) handsFreeCapture = null;
      window.clearTimeout(capture.stopTimer);
      window.clearTimeout(capture.unmuteTimer);
      if (recordingGain) recordingGain.gain.value = 1;
      setState(handsFreeEnabled ? 'listening' : 'idle', true);
      playEarcon('error');
      setVoiceStatus('microphone recording failed', 4000);
    }, {once: true});
    recorder.addEventListener('stop', () => completeHandsFreeRecording(capture), {once: true});
    if (isBargeIn) {
      recordingGain.gain.value = 0;
      capture.unmuteTimer = window.setTimeout(() => {
        if (handsFreeCapture === capture && recordingGain) recordingGain.gain.value = 1;
      }, BARGE_DROP_MS);
    } else {
      recordingGain.gain.value = 1;
    }
    try {
      recorder.start();
    } catch (_) {
      handsFreeCapture = null;
      window.clearTimeout(capture.unmuteTimer);
      recordingGain.gain.value = 1;
      setState('listening', true);
      playEarcon('error');
      setVoiceStatus('microphone recording failed', 4000);
      return;
    }
    setState('recording');
  }

  function finishHandsFreeRecording(forceUpload, delay) {
    const capture = handsFreeCapture;
    if (!capture || capture.finishing || capture.recorder.state === 'inactive') return;
    capture.finishing = true;
    capture.forceUpload = forceUpload;
    capture.stopTimer = window.setTimeout(() => {
      if (capture.recorder.state !== 'inactive') capture.recorder.stop();
    }, delay);
  }

  function completeHandsFreeRecording(capture) {
    if (handsFreeCapture === capture) handsFreeCapture = null;
    window.clearTimeout(capture.stopTimer);
    window.clearTimeout(capture.unmuteTimer);
    if (recordingGain) recordingGain.gain.value = 1;
    if (capture.failed || capture.discard || !handsFreeEnabled) return;
    const speechMilliseconds = Math.max(0, capture.lastSpeechAt - capture.speechStarted + VAD_SAMPLE_MS);
    if (!capture.forceUpload && speechMilliseconds < VAD_MIN_UTTERANCE_MS) {
      setState('listening', true);
      return;
    }
    const actualType = capture.recorder.mimeType || (capture.chunks[0] && capture.chunks[0].type) || 'audio/webm';
    const blob = new Blob(capture.chunks, {type: actualType});
    if (!blob.size) {
      setState('listening', true);
      playEarcon('error');
      setVoiceStatus('microphone recording failed', 4000);
      return;
    }
    setState('sending');
    const row = addMessage('mine', {
      voice: true,
      duration_seconds: (performance.now() - capture.started) / 1000,
      timestamp: new Date().toISOString()
    }, 'sending');
    const id = clientID();
    resetReplyTracking();
    awaitingClientID = id;
    pendingRows.set(id, row);
    deliverVoice({blob, mimeType: actualType, clientID: id, row, attempt: 0, handsFree: true});
  }

  function resetReplyTracking() {
    window.clearTimeout(replyTimer);
    window.clearTimeout(audioWaitTimer);
    replyTimer = null;
    audioWaitTimer = null;
    awaitingClientID = '';
    awaitingMessageID = 0;
    activeReplyID = 0;
    lateAudioUntil = 0;
  }

  function handsFreeUploadAccepted(id, messageID) {
    if (!handsFreeEnabled || id !== awaitingClientID || !messageID) return;
    awaitingMessageID = messageID;
    setState('thinking');
    replyTimer = window.setTimeout(() => {
      if (!handsFreeEnabled || state !== 'thinking' || activeReplyID) return;
      resetReplyTracking();
      setState('listening');
    }, REPLY_TIMEOUT_MS);
  }

  function handsFreeUploadFailed(id) {
    if (!handsFreeEnabled || id !== awaitingClientID) return;
    resetReplyTracking();
    setState('listening', true);
    playEarcon('error');
  }

  function handleHandsFreeReply(data) {
    if (!handsFreeEnabled || state !== 'thinking' || data.replay || !awaitingMessageID || activeReplyID) return;
    const replyTo = Number(data.reply_to || 0);
    if (replyTo !== 0 && replyTo !== awaitingMessageID) return;
    activeReplyID = Number(data.message_id || 0);
    if (!activeReplyID) return;
    window.clearTimeout(replyTimer);
    replyTimer = null;
    lateAudioUntil = Date.now() + REPLY_TIMEOUT_MS;
    refreshAudioWait();
  }

  function refreshAudioWait() {
    if (!activeReplyID || state !== 'thinking') return;
    window.clearTimeout(audioWaitTimer);
    audioWaitTimer = window.setTimeout(() => {
      if (handsFreeEnabled && state === 'thinking') setState('listening');
    }, REPLY_AUDIO_WAIT_MS);
  }

  function acceptsHandsFreeAudio(item) {
    const messageID = Number(item.message_id || 0);
    if (ignoredAudioReplyIDs.includes(messageID)) return false;
    if (!handsFreeEnabled) return true;
    return messageID > 0 && messageID === activeReplyID && Date.now() <= lateAudioUntil;
  }

  function ignoreAudioReply(messageID) {
    if (!messageID || ignoredAudioReplyIDs.includes(messageID)) return;
    ignoredAudioReplyIDs.push(messageID);
    if (ignoredAudioReplyIDs.length > 20) ignoredAudioReplyIDs.shift();
  }

  function markInterrupted(item) {
    const row = rows.get(rowKey('agent', Number(item && item.message_id || 0)));
    if (!row || row.classList.contains('interrupted')) return;
    row.classList.add('interrupted');
    const label = document.createElement('span');
    label.className = 'interruption';
    label.textContent = '⚠ interrupted';
    row.metaNode.append(label);
  }

  function bargeIn() {
    if (!handsFreeEnabled || state !== 'speaking' || !currentAudio || handsFreeCapture) return;
    const interrupted = currentAudio;
    const messageID = Number(interrupted.message_id || 0);
    markInterrupted(interrupted);
    ignoreAudioReply(messageID);
    for (let index = audioQueue.length - 1; index >= 0; index -= 1) {
      if (Number(audioQueue[index].message_id || 0) === messageID) audioQueue.splice(index, 1);
    }
    if (audioHistory[audioHistory.length - 1] === interrupted) audioHistory.pop();
    replayAudioButton.disabled = audioHistory.length === 0;
    suppressPlaybackPauseUntil = performance.now() + 500;
    player.pause();
    currentAudio = null;
    clearPlayerSource();
    stopAudioButton.hidden = true;
    startHandsFreeRecording(true);
  }

  function handleMicrophoneLost() {
    if (!handsFreeEnabled) return;
    handsFreeEnabled = false;
    updateHandsFreeButton();
    resetReplyTracking();
    if (handsFreeCapture && handsFreeCapture.recorder.state !== 'inactive') {
      handsFreeCapture.discard = true;
      handsFreeCapture.recorder.stop();
    }
    releaseMicrophone();
    micButton.disabled = false;
    setState('idle', true);
    playEarcon('error');
    setVoiceStatus('microphone lost — tap hands-free to resume');
    updateWakeLock();
  }

  async function enableHandsFree() {
    if (handsFreeStarting || handsFreeEnabled) return;
    handsFreeStarting = true;
    handsFreeButton.disabled = true;
    let stream;
    try {
      createAudioContext();
      const contextReady = audioContext.resume();
      const playbackReady = audioUnlocked ? Promise.resolve(true) : unlockAudio();
      await contextReady;
      if (!(await playbackReady)) throw new Error('audio unlock failed');
      if (!voiceEnabled && !(await changeVoicePreference(true))) throw new Error('voice preference failed');
      stream = await navigator.mediaDevices.getUserMedia({audio: {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true
      }});
      microphoneStream = stream;
      connectMicrophoneGraph(stream);
      stream.getAudioTracks().forEach(track => { track.onended = handleMicrophoneLost; });
      noiseFloor = VAD_INITIAL_FLOOR;
      floorFrozenUntil = performance.now();
      handsFreeEnabled = true;
      updateHandsFreeButton();
      micButton.disabled = true;
      setVoiceStatus('');
      if (currentAudio || audioQueue.length) enterHandsFreeSpeaking();
      else setState('listening');
      startVAD();
      updateWakeLock();
    } catch (error) {
      if (stream) stream.getTracks().forEach(track => track.stop());
      microphoneStream = null;
      releaseMicrophone();
      handsFreeEnabled = false;
      updateHandsFreeButton();
      setState('idle', true);
      playEarcon('error');
      const denied = error && (error.name === 'NotAllowedError' || error.name === 'SecurityError');
      setVoiceStatus(denied ? 'Microphone permission denied — allow it in browser settings, then tap hands-free.' : 'Hands-free microphone unavailable — check browser permission.');
    } finally {
      handsFreeStarting = false;
      handsFreeButton.disabled = false;
    }
  }

  function disableHandsFree() {
    if (!handsFreeEnabled && !handsFreeStarting) return;
    handsFreeEnabled = false;
    updateHandsFreeButton();
    resetReplyTracking();
    if (handsFreeCapture && handsFreeCapture.recorder.state !== 'inactive') {
      handsFreeCapture.discard = true;
      handsFreeCapture.recorder.stop();
    }
    releaseMicrophone();
    micButton.disabled = false;
    stopPlayback();
    setState('idle', true);
    setVoiceStatus('');
    updateWakeLock();
  }

  function updateMediaMetadata(item) {
    if (!navigator.mediaSession || !window.MediaMetadata || !item) return;
    const row = rows.get(rowKey('agent', Number(item.message_id || 0)));
    navigator.mediaSession.metadata = new MediaMetadata({
      title: String(row ? row.replyText : '').slice(0, 60),
      artist: 'C3'
    });
  }

  function clearPlayerSource() {
    player.removeAttribute('src');
    player.load();
  }

  function stopPlayback() {
    suppressPlaybackPauseUntil = performance.now() + 500;
    player.pause();
    currentAudio = null;
    audioQueue.length = 0;
    clearPlayerSource();
    stopAudioButton.hidden = true;
    if (handsFreeEnabled) setState('listening');
  }

  function playNext() {
    if (!voiceEnabled || currentAudio || !audioQueue.length || unlockingAudio) return;
    const next = audioQueue[0];
    if (!rows.has(rowKey('agent', Number(next.message_id || 0))) && Date.now() - Number(next.queuedAt || 0) < 2000) {
      window.setTimeout(playNext, 50);
      return;
    }
    currentAudio = audioQueue.shift();
    player.src = currentAudio.url;
    updateMediaMetadata(currentAudio);
    player.play().then(() => {
      audioUnlocked = true;
      audioHistory.push(currentAudio);
      if (audioHistory.length > 20) audioHistory.shift();
      replayAudioButton.disabled = false;
    }).catch(() => {
      audioQueue.unshift(currentAudio);
      currentAudio = null;
      audioUnlocked = false;
      if (handsFreeEnabled) setState('listening', true);
      setVoiceStatus('Tap 🔊 to unlock spoken replies.');
    });
  }

  function replayAt(index) {
    const item = audioHistory[index];
    if (!item || !voiceEnabled) return;
    suppressPlaybackPauseUntil = performance.now() + 500;
    player.pause();
    currentAudio = null;
    clearPlayerSource();
    audioQueue.unshift(item);
    playNext();
  }

  function replayLast() {
    replayAt(audioHistory.length - 1);
  }

  function replayPrevious() {
    replayAt(audioHistory.length - 2);
  }

  async function unlockAudio() {
    unlockingAudio = true;
    player.src = '/audio/unlock';
    try {
      await player.play();
      audioUnlocked = true;
      player.pause();
      clearPlayerSource();
      setVoiceStatus('');
      return true;
    } catch (_) {
      audioUnlocked = false;
      setVoiceStatus('Could not unlock audio playback.', 4000);
      return false;
    } finally {
      unlockingAudio = false;
    }
  }

  async function changeVoicePreference(enabled) {
    if (enabled && !audioUnlocked && !(await unlockAudio())) return false;
    try {
      const response = await fetch('/voice', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({enabled})
      });
      if (!response.ok) throw new Error('preference failed');
      voiceEnabled = enabled;
      updateVoiceButton();
      if (!enabled) {
        if (handsFreeEnabled) disableHandsFree();
        stopPlayback();
      } else {
        playNext();
      }
      updateWakeLock();
      return true;
    } catch (_) {
      setVoiceStatus('Could not change spoken replies.', 4000);
      return false;
    }
  }

  voiceButton.addEventListener('click', async () => {
    if (voiceEnabled && !audioUnlocked) {
      if (await unlockAudio()) playNext();
      return;
    }
    await changeVoicePreference(!voiceEnabled);
  });

  handsFreeButton.addEventListener('click', () => {
    if (handsFreeEnabled) disableHandsFree();
    else enableHandsFree();
  });

  stopAudioButton.addEventListener('click', stopPlayback);
  replayAudioButton.addEventListener('click', replayLast);
  function enterHandsFreeSpeaking() {
    window.clearTimeout(audioWaitTimer);
    audioWaitTimer = null;
    speakingStartedAt = performance.now();
    playbackFloor = noiseFloor;
    bargeAboveMilliseconds = 0;
    setState('speaking');
  }

  player.addEventListener('play', () => {
    if (unlockingAudio) return;
    stopAudioButton.hidden = false;
    if (handsFreeEnabled) enterHandsFreeSpeaking();
  });
  player.addEventListener('pause', () => {
    if (unlockingAudio || performance.now() < suppressPlaybackPauseUntil) return;
    stopAudioButton.hidden = true;
    if (handsFreeEnabled && state === 'speaking') setState('listening');
  });

  function finishPlayback() {
    if (unlockingAudio) return;
    currentAudio = null;
    stopAudioButton.hidden = true;
    clearPlayerSource();
    if (audioQueue.length) {
      playNext();
    } else if (handsFreeEnabled) {
      setState('listening');
    }
  }

  player.addEventListener('ended', finishPlayback);
  player.addEventListener('error', finishPlayback);

  if (navigator.mediaSession) {
    const actions = {
      play: () => player.play(),
      pause: stopPlayback,
      stop: stopPlayback,
      nexttrack: replayLast,
      previoustrack: replayPrevious
    };
    Object.entries(actions).forEach(([name, handler]) => {
      try { navigator.mediaSession.setActionHandler(name, handler); } catch (_) {}
    });
  }

  function wantsWakeLock() {
    return voiceEnabled || handsFreeEnabled;
  }

  async function requestWakeLock() {
    if (!navigator.wakeLock || wakeLockSentinel || wakeLockRequesting || !wantsWakeLock() || document.visibilityState !== 'visible') return;
    wakeLockRequesting = true;
    try {
      const sentinel = await navigator.wakeLock.request('screen');
      wakeLockSentinel = sentinel;
      sentinel.addEventListener('release', () => {
        if (wakeLockSentinel === sentinel) wakeLockSentinel = null;
        if (wantsWakeLock() && document.visibilityState === 'visible') window.setTimeout(requestWakeLock, 0);
      }, {once: true});
    } catch (_) {
    } finally {
      wakeLockRequesting = false;
    }
  }

  function updateWakeLock() {
    if (wantsWakeLock()) {
      requestWakeLock();
    } else if (wakeLockSentinel) {
      const sentinel = wakeLockSentinel;
      wakeLockSentinel = null;
      sentinel.release().catch(() => {});
    }
  }

  function connect() {
    setConnection('reconnecting…', '');
    const events = new EventSource('/events');
    events.onopen = () => {
      setConnection(detached ? 'no session attached — reconnected' : 'connected', detached ? 'detached' : 'connected');
      if (handsFreeEnabled && awaitingMessageID && !activeReplyID && state === 'listening') setState('thinking');
      scrollBottom();
    };
    events.onerror = () => {
      const closed = events.readyState === EventSource.CLOSED;
      setConnection(closed ? 'disconnected — reload to sign in' : 'reconnecting…', closed ? 'disconnected' : '');
      if (closed && handsFreeEnabled && state === 'thinking') {
        resetReplyTracking();
        setState('listening');
      }
    };
    function markConnected() {
      detached = false;
      setConnection('connected', 'connected');
    }
    events.addEventListener('message', event => {
      markConnected();
      const data = JSON.parse(event.data);
      addMessage('agent', data);
      handleHandsFreeReply(data);
    });
    events.addEventListener('own', event => renderOwn(JSON.parse(event.data)));
    events.addEventListener('status', event => {
      const data = JSON.parse(event.data);
      addMessage('status', data);
      if (String(data.text || '').startsWith('📨 Held')) {
        detached = true;
        setConnection('no session attached', 'detached');
      }
    });
    events.addEventListener('typing', () => {
      markConnected();
      typing.textContent = 'agent is typing…';
      window.clearTimeout(typingTimer);
      typingTimer = window.setTimeout(() => { typing.textContent = ''; }, 3500);
      if (handsFreeEnabled && state === 'thinking' && activeReplyID) refreshAudioWait();
      scrollBottom();
    });
    events.addEventListener('edit', event => {
      markConnected();
      const data = JSON.parse(event.data);
      if (data.voice) {
        const row = rows.get(rowKey('mine', Number(data.message_id || 0)));
        if (row) {
          renderVoice(row.bodyNode, {
            voice: true, duration_seconds: row.voiceDuration, text: data.text || ''
          });
        } else {
          addMessage('mine', data, 'sent');
        }
      } else {
        const row = rows.get(rowKey('agent', Number(data.message_id || 0)));
        if (row) {
          row.replyText = String(data.text || '');
          renderText(row.bodyNode, data.text || '');
        } else addMessage('agent', data);
      }
      scrollBottom();
    });
    events.addEventListener('prefs', event => {
      const data = JSON.parse(event.data);
      voiceEnabled = Boolean(data.voice);
      updateVoiceButton();
      if (!voiceEnabled) {
        if (handsFreeEnabled) disableHandsFree();
        stopPlayback();
      }
      updateWakeLock();
    });
    events.addEventListener('audio', event => {
      if (!voiceEnabled) return;
      const item = JSON.parse(event.data);
      if (!acceptsHandsFreeAudio(item)) return;
      item.queuedAt = Date.now();
      window.clearTimeout(audioWaitTimer);
      audioWaitTimer = null;
      audioQueue.push(item);
      playNext();
    });
  }

  document.getElementById('logout').addEventListener('click', async () => {
    const response = await fetch('/logout', {method: 'POST'});
    if (response.ok || response.status === 401) location.assign('/login');
  });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') {
      if (state === 'recording' && handsFreeCapture) finishHandsFreeRecording(true, VAD_RECORDER_STOP_DELAY_MS);
      stopVAD();
      return;
    }
    resumeAudioContext();
    startVAD();
    requestWakeLock();
  });
  if (window.isSecureContext && 'serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(error => {
      console.error('web: service worker registration failed', error);
    });
  }
  if (window.visualViewport) window.visualViewport.addEventListener('resize', scrollBottom);
  input.addEventListener('focus', scrollBottom);
  updateHandsFreeButton();
  connect();
  input.focus({preventScroll: true});
})();
</script>
</body>
</html>
