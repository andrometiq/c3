<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="color-scheme" content="dark">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title>C3 web chat</title>
  <style>
    :root { color-scheme: dark; font: 17px/1.45 system-ui, sans-serif; background: #0b0d10; color: #f4f6f8; }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; overflow: hidden; }
    body { margin: 0; min-height: 100dvh; background: #0b0d10; }
    button { -webkit-tap-highlight-color: transparent; }
    #view-shell { width: 200vw; height: 100dvh; display: flex; transform: translateX(0); transition: transform 150ms ease; }
    #view-shell.show-chat { transform: translateX(-50%); }
    .view-panel { width: 100vw; height: 100dvh; min-width: 0; flex: 0 0 100vw; }
    #view-drive { --drive-colour: #14181d; --drive-cancel: #b3261e; position: relative; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; overflow: hidden; padding: max(.65rem, env(safe-area-inset-top)) max(.75rem, env(safe-area-inset-right)) max(.75rem, env(safe-area-inset-bottom)) max(.75rem, env(safe-area-inset-left)); background: var(--drive-colour); color: #fff; transition: background-color 150ms linear; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    #view-drive.lamp-recording { --drive-colour: #b3261e; }
    #view-drive.lamp-wait { --drive-colour: #8a5a00; }
    #view-drive.lamp-speaking { --drive-colour: #1e6b3a; }
    #view-drive.lamp-listening { --drive-colour: #1f4f8a; }
    #view-drive.lamp-detached { --drive-colour: #6e1414; }
    .drive-top, .drive-bottom { z-index: 1; display: grid; grid-template-columns: minmax(64px, 1fr) auto minmax(64px, 1fr); align-items: center; gap: .6rem; }
    .drive-control { min-width: 64px; min-height: 64px; border: 1px solid rgba(255,255,255,.48); border-radius: 1rem; padding: .35rem .55rem; background: rgba(0,0,0,.18); color: #fff; font: 700 16px/1.1 system-ui, sans-serif; }
    .drive-control:first-child { justify-self: start; }
    .drive-control:last-child { justify-self: end; }
    .drive-control[aria-pressed="true"] { background: rgba(0,0,0,.42); border-color: #fff; }
    .drive-icon { display: block; margin-bottom: .15rem; font-size: 23px; line-height: 1; }
    #drive-chip { max-width: min(56vw, 19rem); overflow: hidden; border: 1px solid rgba(255,255,255,.5); border-radius: 999px; padding: .45rem .8rem; background: rgba(0,0,0,.22); color: #fff; font: 700 22px/1.2 system-ui, sans-serif; text-align: center; text-overflow: ellipsis; white-space: nowrap; }
    #drive-chip.held { border-color: #ffd36a; color: #fff4d2; animation: held-pulse 1.6s ease-in-out infinite; }
    @keyframes held-pulse { 50% { background: rgba(97,61,0,.66); } }
    .drive-centre { position: relative; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: .5rem 0; }
    #drive-lock-row { min-height: 4rem; margin-bottom: .35rem; display: flex; align-items: center; justify-content: center; gap: .6rem; }
    #drive-lock-hint { min-height: 1.5rem; margin-bottom: .35rem; border-radius: 999px; padding: .2rem .65rem; background: rgba(0,0,0,.18); color: rgba(255,255,255,.68); font: 700 16px/1.2 system-ui, sans-serif; opacity: 0; transform: translateY(.35rem); transition: color 120ms linear, opacity 120ms linear, transform 120ms ease; }
    #drive-lock-hint.visible { opacity: 1; }
    #drive-lock-hint.approaching, #drive-lock-hint.locked { background: rgba(0,0,0,.38); color: #fff; transform: translateY(0); }
    #drive-circle { width: clamp(220px, 64vmin, 340px); height: clamp(220px, 64vmin, 340px); border: 3px solid rgba(255,255,255,.72); border-radius: 50%; display: flex; flex: 0 0 auto; flex-direction: column; align-items: center; justify-content: center; padding: 1rem; background: rgba(0,0,0,.16); box-shadow: inset 0 0 0 1px rgba(0,0,0,.18); color: #fff; touch-action: none; user-select: none; }
    #drive-circle.drive-pressed { animation: none; transform: scale(.96); }
    #drive-circle.cancel-armed { border-color: #fff; box-shadow: 0 0 0 7px rgba(179,38,30,.78), inset 0 0 0 1px rgba(0,0,0,.18); }
    #drive-cancel { min-width: 64px; min-height: 64px; border: 2px solid #fff; border-radius: 1rem; padding: .3rem .55rem; background: var(--drive-cancel); color: #fff; font: 700 15px/1.1 system-ui, sans-serif; }
    #drive-cancel[hidden] { display: none; }
    #drive-cancel.holding { animation: cancel-hold 700ms linear forwards; }
    @keyframes cancel-hold { to { box-shadow: inset 0 -64px 0 rgba(0,0,0,.42); } }
    #view-drive.lamp-recording #drive-circle, #view-drive.lamp-listening #drive-circle { animation: drive-breathe 1.8s ease-in-out infinite; }
    #view-drive.lamp-recording #drive-circle.drive-pressed, #view-drive.lamp-listening #drive-circle.drive-pressed { animation: none; transform: scale(.96); }
    @keyframes drive-breathe { 50% { transform: scale(1.02); } }
    #drive-word { font: 700 clamp(36px, 9vw, 40px)/1 system-ui, sans-serif; letter-spacing: .02em; text-align: center; }
    #drive-hint { min-height: 1.3em; margin-top: .65rem; font: 500 16px/1.3 system-ui, sans-serif; }
    #drive-cancel-zone { position: absolute; z-index: 2; left: 50%; bottom: .35rem; min-width: min(88vw, 22rem); min-height: 3.4rem; display: flex; align-items: center; justify-content: center; gap: .45rem; border: 2px solid rgba(255,255,255,.9); border-radius: 999px; padding: .5rem 1rem; background: rgba(179,38,30,.9); color: #fff; font: 800 18px/1.1 system-ui, sans-serif; opacity: 0; transform: translate(-50%, .55rem); visibility: hidden; transition: opacity 120ms linear, transform 120ms ease; }
    #drive-cancel-zone.armed { opacity: 1; transform: translate(-50%, 0); visibility: visible; }
    .draft-offer { width: min(92vw, 42rem); margin: .55rem 0 0; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: .45rem; border: 1px solid #70b7ff; border-radius: .7rem; padding: .55rem; background: rgba(0,0,0,.3); }
    .draft-offer[hidden] { display: none; }
    .draft-offer button { min-height: 2.8rem; border: 1px solid rgba(255,255,255,.6); border-radius: .55rem; padding: .45rem .7rem; background: #173756; color: #fff; font: 700 .9rem/1.1 system-ui, sans-serif; }
    .draft-offer .draft-discard { background: #6e1414; }
    #chat-draft-offer { width: auto; margin: 0 .8rem .55rem; }
    #drive-last-reply-block { width: min(92vw, 42rem); min-height: 1.5rem; margin: .8rem 0 0; display: flex; align-items: center; justify-content: center; gap: .45rem; }
    #drive-last-reply { min-width: 0; max-width: 100%; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; border: 0; padding: 0; background: transparent; color: #fff; font: 500 18px/1.35 system-ui, sans-serif; text-align: center; overflow-wrap: anywhere; }
    #drive-reply-play { min-width: 2.6rem; min-height: 2.6rem; flex: 0 0 2.6rem; border: 1px solid rgba(255,255,255,.55); border-radius: 50%; background: rgba(0,0,0,.24); color: #fff; font: 700 18px/1 system-ui, sans-serif; }
    #drive-transcript { width: min(92vw, 42rem); min-height: 1.4rem; margin-top: .35rem; overflow: hidden; color: #fff; font: 400 16px/1.3 system-ui, sans-serif; text-align: center; text-overflow: ellipsis; white-space: nowrap; }
    #drive-last-reply-block:has(#drive-last-reply:not(:empty)), #drive-transcript:not(:empty) { border-radius: .55rem; padding: .25rem .5rem; background: rgba(0,0,0,.18); }
    .drive-bottom { grid-template-columns: minmax(64px, 1fr) 1fr minmax(64px, 1fr); }
    #drive-live { grid-column: 1; }
    #drive-replay { grid-column: 3; }
    #drive-live[aria-pressed="true"] { background: #123d70; border-color: #fff; }
    #view-chat { visibility: hidden; overflow: hidden; background: #0b0d10; }
    #view-chat.history-ready { visibility: visible; }
    .chat-main { width: min(760px, 100%); height: 100dvh; margin: auto; display: grid; grid-template-rows: auto 1fr auto; }
    header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: .75rem; padding: .75rem 1rem; background: #11151a; border-bottom: 1px solid #2d333b; }
    h1 { min-width: 0; margin: 0; overflow: hidden; color: #f4f6f8; font-size: 1.05rem; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    #connection { min-width: 0; max-width: 10rem; overflow: hidden; color: #f2c94c; font-size: .88rem; text-decoration: none; text-overflow: ellipsis; white-space: nowrap; }
    #connection.connected { color: #77d68c; }
    #connection.detached { color: #9fb3c8; }
    #connection.disconnected { color: #ff6b6b; text-decoration: underline; }
    #hands-free-state { border: 1px solid #46515e; border-radius: 999px; padding: .22rem .55rem; color: #c5ced8; font-size: .76rem; white-space: nowrap; }
    #hands-free-state.state-listening { border-color: #77d68c; color: #77d68c; }
    #hands-free-state.state-recording { border-color: #ff6b6b; color: #ff9aa7; }
    #hands-free-state.state-sending, #hands-free-state.state-thinking { border-color: #f2c94c; color: #f2c94c; }
    #hands-free-state.state-speaking { border-color: #70b7ff; color: #70b7ff; }
    .header-control { min-width: 2.6rem; min-height: 2.6rem; border: 1px solid #46515e; border-radius: .55rem; padding: .3rem .5rem; background: #1a2027; color: #f4f6f8; font: inherit; flex: 0 0 auto; }
    .header-control:disabled { opacity: .45; }
    #logout { border: 0; padding: .25rem; background: transparent; color: #aeb8c4; text-decoration: underline; font: inherit; font-size: .82rem; flex: 0 0 auto; }
    #presence-sheet-backdrop { position: fixed; z-index: 10; inset: 0; display: grid; align-items: end; padding: 1rem; background: rgba(0,0,0,.62); }
    #presence-sheet-backdrop[hidden] { display: none; }
    #presence-sheet { width: min(34rem, 100%); margin: 0 auto; border: 1px solid #46515e; border-radius: 1rem; padding: 1rem; background: #161c23; box-shadow: 0 8px 32px rgba(0,0,0,.55); }
    #presence-sheet-header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    #presence-sheet h2 { margin: 0; font-size: 1.05rem; }
    #presence-sheet-close { min-width: 2.6rem; min-height: 2.6rem; border: 1px solid #46515e; border-radius: 50%; background: #222b35; color: #fff; font: 700 1.1rem/1 system-ui, sans-serif; }
    #presence-empty { margin: .85rem 0 .2rem; color: #aeb8c4; }
    #presence-details { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .45rem .8rem; margin: .85rem 0 .2rem; }
    #presence-details dt { color: #9ba7b4; }
    #presence-details dd { min-width: 0; margin: 0; overflow-wrap: anywhere; font-family: ui-monospace, monospace; }
    #presence-settings { margin-top: 1rem; padding-top: .85rem; border-top: 1px solid #46515e; }
    #presence-settings h3 { margin: 0 0 .55rem; font-size: .95rem; }
    #haptics-toggle { width: 100%; min-height: 3rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; border: 1px solid #596b7d; border-radius: .65rem; padding: .55rem .75rem; background: #1a2027; color: #fff; font: 700 1rem/1.2 system-ui, sans-serif; }
    #haptics-toggle[aria-pressed="true"] { border-color: #70b7ff; background: #173756; }
    #doc-viewer { position: fixed; z-index: 20; inset: 0; background: #0b0d10; }
    #doc-viewer[hidden] { display: none; }
    #doc-viewer-dialog { width: 100%; height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); }
    #doc-viewer-header { display: flex; align-items: center; gap: .75rem; padding: max(.65rem, env(safe-area-inset-top)) max(.75rem, env(safe-area-inset-right)) .65rem max(.75rem, env(safe-area-inset-left)); border-bottom: 1px solid #2d333b; background: #11151a; }
    #doc-viewer-title { min-width: 0; margin: 0; overflow: hidden; font-size: 1rem; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    #doc-viewer-close { min-width: 2.6rem; min-height: 2.6rem; border: 1px solid #46515e; border-radius: 50%; background: #222b35; color: #fff; font: 700 1.1rem/1 system-ui, sans-serif; }
    #doc-viewer-frame { min-height: 0; background: #fff; }
    #doc-viewer-frame iframe { width: 100%; height: 100%; display: block; border: 0; background: #fff; }
    #messages { position: relative; min-height: 0; overflow-y: auto; padding: 1rem; scroll-padding-block: 4rem 9rem; }
    #message-list { min-height: 1px; }
    #load-earlier { display: block; min-height: 2.6rem; margin: 0 auto 1rem; border: 1px solid #46515e; border-radius: 999px; padding: .35rem .9rem; background: #1a2027; color: #d9e1e9; font: inherit; }
    #load-earlier[hidden] { display: none; }
    #new-messages { position: sticky; z-index: 2; left: 50%; bottom: .25rem; display: block; min-height: 2.6rem; margin: -3rem auto .35rem; transform: translateX(-50%); border: 1px solid #70b7ff; border-radius: 999px; padding: .35rem .85rem; background: #173756; color: #fff; font: 700 .9rem/1 system-ui, sans-serif; box-shadow: 0 2px 8px rgba(0,0,0,.45); }
    #new-messages[hidden] { display: none; }
    .message { max-width: 88%; margin: 0 0 1rem; padding: .72rem .85rem; border-radius: .9rem; background: #1a2027; box-shadow: 0 1px 0 #303842; }
    .message.mine { margin-left: auto; background: #173756; }
    .message.status { max-width: 100%; margin: .5rem 0 1rem; padding: .25rem .1rem; background: transparent; box-shadow: none; color: #aeb8c4; font-size: .9rem; }
    .message.interrupted { border: 1px solid #f2c94c; }
    .interruption { color: #f2c94c; }
    .body { overflow-wrap: anywhere; }
    .body.literal { white-space: pre-wrap; }
    .voice-label { display: block; font-weight: 700; }
    .voice-transcript { margin-top: .45rem; padding-top: .45rem; border-top: 1px solid #416786; white-space: pre-wrap; }
    .transcript-fold { display: block; width: 100%; min-height: 2rem; margin: .3rem 0; border: 1px dashed #70b7ff; border-radius: 999px; background: #102c47; color: #dcecff; font: 700 .9rem/1.2 system-ui, sans-serif; }
    .transcript-middle { max-height: 0; overflow: hidden; opacity: 0; transition: max-height 180ms ease, opacity 140ms linear; }
    .transcript-middle.expanded { opacity: 1; }
    .transcript-part { white-space: pre-wrap; }
    .body p { margin: 0 0 .65rem; }
    .body p:last-child { margin-bottom: 0; }
    .body .heading { font-size: 1.08rem; font-weight: 700; }
    .body pre { margin: .4rem 0 .7rem; padding: .6rem; overflow-x: auto; border-radius: .4rem; background: #0c1014; color: #e6edf3; font: .9rem/1.45 ui-monospace, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
    .body code { padding: .08rem .25rem; border-radius: .25rem; background: #0c1014; color: #e6edf3; font: .9em ui-monospace, monospace; }
    .body pre code { padding: 0; background: transparent; font: inherit; }
    .body a { color: #70b7ff; text-decoration-thickness: .08em; text-underline-offset: .12em; }
    .body .spoiler { border-radius: .2rem; background: #d6dde5; color: transparent; text-shadow: 0 0 .45rem #050607; cursor: pointer; }
    .body .spoiler.revealed { background: transparent; color: inherit; text-shadow: none; cursor: text; }
    .body ul, .body ol { margin: .35rem 0 .7rem; padding-left: 1.55rem; }
    .body blockquote { margin: .35rem 0 .7rem; padding: .1rem .7rem; border-left: .22rem solid #596b7d; color: #c5ced8; }
    .body hr { height: 1px; margin: .75rem 0; border: 0; background: #46515e; }
    .table-scroll { max-width: 100%; margin: .4rem 0 .7rem; overflow-x: auto; }
    .body table { border-collapse: collapse; white-space: nowrap; }
    .body th, .body td { padding: .35rem .55rem; border: 1px solid #46515e; text-align: left; }
    .body th { background: #111820; }
    .meta { display: flex; gap: .45rem; margin-top: .3rem; color: #9ba7b4; font-size: .76rem; }
    .doc-card { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .65rem; margin-top: .65rem; padding: .7rem; border: 1px solid #46515e; border-radius: .7rem; background: #111820; }
    .doc-card.expired { opacity: .68; }
    .doc-icon { font-size: 1.6rem; line-height: 1.2; }
    .doc-details { min-width: 0; }
    .doc-name { overflow: hidden; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .doc-size, .doc-status { color: #aeb8c4; font-size: .82rem; }
    .doc-actions { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .55rem; }
    .doc-actions button { min-height: 2.5rem; border: 1px solid #596b7d; border-radius: .5rem; padding: .35rem .7rem; background: #173756; color: #fff; font: 700 .9rem/1 system-ui, sans-serif; }
    .doc-actions button:disabled { opacity: .5; }
    .message-audio { min-width: 2rem; min-height: 2rem; margin: -.25rem 0 -.25rem auto; border: 1px solid #46515e; border-radius: 50%; background: #111820; color: #f4f6f8; font: 700 .9rem/1 system-ui, sans-serif; }
    .delivery.retrying { color: #f2c94c; }
    .delivery.failed { color: #ff6b6b; }
    #typing { min-height: 1.5rem; padding: 0 1rem .3rem; color: #aeb8c4; font-size: .88rem; }
    #voice-status { min-height: 1.35rem; padding: 0 1rem .35rem; color: #aeb8c4; font-size: .82rem; }
    form { position: sticky; bottom: 0; display: grid; grid-template-columns: 1fr auto auto; gap: .65rem; padding: .8rem max(.8rem, env(safe-area-inset-right)) max(.8rem, env(safe-area-inset-bottom)) max(.8rem, env(safe-area-inset-left)); background: #11151a; border-top: 1px solid #2d333b; }
    .compose-field { min-width: 0; }
    textarea { width: 100%; min-height: 3.25rem; max-height: 9rem; resize: none; border: 1px solid #46515e; border-radius: .65rem; padding: .72rem; background: #0b0d10; color: #fff; font: inherit; }
    textarea:focus { outline: 3px solid #2879c7; outline-offset: 1px; }
    #counter { display: block; margin-top: .15rem; color: #aeb8c4; font-size: .75rem; text-align: right; }
    #counter[hidden] { display: none; }
    #mic, #send { min-height: 3.25rem; border: 0; border-radius: .65rem; padding: .65rem 1rem; color: #fff; font: 700 1rem system-ui, sans-serif; }
    #mic { min-width: 4.5rem; background: #46515e; }
    #mic[aria-pressed="true"] { background: #b33b4a; }
    #mic:disabled { opacity: .65; }
    #send { min-width: 5.7rem; background: #2f8ad5; }
    #send:active { background: #246fae; }
    @media (max-width: 560px) {
      header { flex-wrap: wrap; gap: .4rem; padding-inline: .65rem; }
      h1 { font-size: .95rem; }
      #connection { max-width: 8rem; font-size: .76rem; flex: 1 1 5.5rem; }
      #hands-free-state { max-width: 6.8rem; overflow: hidden; text-overflow: ellipsis; }
      .header-control { min-width: 2.4rem; padding-inline: .35rem; font-size: .82rem; }
      #stop-audio, #replay-audio { font-size: 0; }
      #stop-audio::before { content: '■'; font-size: .82rem; }
      #replay-audio::before { content: '↻'; font-size: 1.1rem; }
      form { gap: .45rem; }
      #mic, #send { min-width: 3.8rem; padding-inline: .65rem; }
    }
    @media (max-height: 650px) {
      #drive-last-reply { -webkit-line-clamp: 2; margin-top: .45rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      #view-shell, #view-drive { transition: none; }
      #drive-lock-hint, .transcript-middle { transition: none; }
      #drive-chip.held, #view-drive.lamp-recording #drive-circle, #view-drive.lamp-listening #drive-circle { animation: none; }
      #drive-circle.drive-pressed, #view-drive.lamp-recording #drive-circle.drive-pressed, #view-drive.lamp-listening #drive-circle.drive-pressed { transform: none; }
      #drive-cancel.holding { animation: none; }
      #drive-cancel-zone { transition: none; }
    }
  </style>
</head>
<body>
<div id="view-shell">
  <section id="view-drive" class="view-panel lamp-idle" aria-label="Drive view">
    <div class="drive-top">
      <button id="drive-mute" class="drive-control" type="button" aria-label="Mute spoken replies" aria-pressed="false"><span class="drive-icon">🔊</span>Mute</button>
      <button id="drive-chip" type="button" role="status" aria-live="polite" aria-haspopup="dialog">reconnecting…</button>
      <button id="drive-chat" class="drive-control" type="button" aria-label="Open Chat"><span class="drive-icon">💬</span>Chat</button>
    </div>
    <div class="drive-centre">
      <div id="drive-lock-row">
        <div id="drive-lock-hint" aria-hidden="true">▲ lock</div>
        <button id="drive-cancel" type="button" aria-label="Hold to cancel locked recording" hidden><span aria-hidden="true">✕</span> Cancel</button>
      </div>
      <button id="drive-circle" type="button" aria-label="Hold to talk">
        <span id="drive-word">TALK</span>
        <span id="drive-hint">hold to talk</span>
      </button>
      <div id="drive-cancel-zone" role="status" aria-live="polite" aria-hidden="true"><span aria-hidden="true">✕</span> release to cancel</div>
      <div id="drive-draft-offer" class="draft-offer" role="group" aria-label="Unsent recording draft" hidden>
        <button id="drive-draft-resend" type="button">⤴ Resend draft</button>
        <button id="drive-draft-discard" class="draft-discard" type="button" aria-label="Discard unsent recording draft">✕ Discard</button>
      </div>
      <div id="drive-last-reply-block">
        <button id="drive-reply-play" type="button" aria-label="Play last reply" hidden>▶</button>
        <button id="drive-last-reply" type="button" aria-label="Open last reply in Chat"></button>
      </div>
      <div id="drive-transcript" aria-live="polite"></div>
    </div>
    <div class="drive-bottom">
      <button id="drive-live" class="drive-control" type="button" aria-label="Hold to switch live mode" aria-pressed="false"><span class="drive-icon">🎙</span>Live</button>

  // Barge-in energy must exceed eight times the sampled playback floor.

  // Barge-in has a high fixed RMS floor to reject loudspeaker leakage.

  // The error earcon uses a low 220 Hz tone.
  const EARCON_ERROR_HZ = 220;
  // The error earcon lasts 150 ms.
  const EARCON_ERROR_MS = 150;
  // VAD analysis pauses for 200 ms after every audible earcon finishes.
  const EARCON_ANALYSIS_MUTE_MS = 200;
  // An accepted utterance waits at most 90 seconds for its own reply.
  const REPLY_TIMEOUT_MS = 90000;
  // A delivered reply waits ten seconds for synthesized audio.
  const REPLY_AUDIO_WAIT_MS = 10000;
  // All hands-free upload attempts share one 60-second deadline.
  const HANDS_FREE_UPLOAD_TIMEOUT_MS = 60000;
  // Periodic recorder data keeps most captured audio available before stop fires.
  const MEDIA_RECORDER_TIMESLICE_MS = 1000;
  // Earcons ramp up over five milliseconds to avoid an audible click.

  // A view swipe must begin within 24 px of a physical screen edge.

  // A deliberate view swipe travels at least 80 px horizontally.

  // Thirty pixels of vertical drift cancels a view swipe.

  // Movement below 30 px remains a hold dead zone and cancels the Live-button hold.

  // An upward 60 px slide locks a push-to-talk recording.
  const DRIVE_LOCK_DISTANCE_PX = 60;
  // A down-dominant 96 px slide arms cancellation until release.
  const DRIVE_CANCEL_ARM_PX = 96;
  // A cancellation keeps recordings of at least five seconds as a draft.
  const DRIVE_CANCEL_CONFIRM_MS = 5000;
  // Holding the explicit locked-cancel target for 700 ms commits cancellation.
  const DRIVE_LOCKED_CANCEL_MS = 700;
  // The Live target requires a 700 ms hold.

  // Live VAD leaves a 1.2-second cancellable beat before upload.

  // A synthetic circle click is ignored for 400 ms after release.

  // This table is the only definition of local sound, vibration, and speech cues.

    sent: {earcon: 'accepted', vibe: [20, 30, 20], speak: '', safety: false},
    'reply-ready': {earcon: 'reply', vibe: [30, 60, 30], speak: '', safety: false},
    'speaking-start': {earcon: '', vibe: 20, speak: '', safety: false},
    'speaking-end': {earcon: 'endspeak', vibe: 15, speak: '', safety: false},
    'listening-start': {earcon: 'armed', vibe: 15, speak: '', safety: false},
    'speech-end': {earcon: 'sending', vibe: 20, speak: '', safety: false},
    'barge-in': {earcon: 'armed', vibe: [30, 30], speak: '', safety: false},
    'reply-timeout': {earcon: 'endspeak', vibe: [50, 80, 50], speak: 'No reply', safety: true},
    document: {earcon: 'document', vibe: [10, 30, 10, 30, 10], speak: 'Document received', safety: false},
    'cancel-armed': {earcon: '', vibe: 20, speak: '', safety: false},
    'send-cancelled': {earcon: 'error', vibe: [60, 40, 60], speak: 'Send cancelled', safety: true},
    'recording-cancelled': {earcon: 'error', vibe: [60, 40, 60], speak: 'Cancelled', safety: true},
    'draft-saved': {earcon: 'accepted', vibe: [20, 30, 20], speak: 'Saved as draft', safety: true},
    'draft-found': {earcon: 'accepted', vibe: [20, 30, 20], speak: 'Unsent recording found', safety: true},
    'send-refused': {earcon: 'error', vibe: [40, 60, 40, 60, 40], speak: 'Send refused', safety: true},
    error: {earcon: 'error', vibe: [40, 60, 40, 60, 40], speak: '', safety: false}
  };

  function feedbackFor(kind) {
    return feedbackNotices[kind] || null;
  }

  function feedbackKinds() {
    return Object.keys(feedbackNotices);
  }

  function noticeShouldSpeak(notice, spokenReplies, muted) {
    return Boolean(notice && notice.speak && (notice.safety || (spokenReplies && !muted)));
  }

  function pointInsideRect(x, y, rect) {
    return Boolean(rect && x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom);
  }

  function cancelDecision({upward, downward, horizontal, armed, released, insideZone}) {
    const insideCancelZone = downward >= DRIVE_CANCEL_ARM_PX && downward >= horizontal;
    if (released) return armed && insideCancelZone && insideZone ? 'cancel' : 'none';
    if (!armed && upward >= DRIVE_LOCK_DISTANCE_PX && upward >= horizontal) return 'lock';
    if (insideCancelZone) return armed ? 'none' : 'arm';
    if (armed) return 'disarm';
    return 'none';
  }

  function unsentWork({recording, recordingStarting, handsFree, liveSendBeat, pendingCount, undurableDraft, draftWriteInFlight}) {
    return Boolean(recording || recordingStarting || handsFree || liveSendBeat || pendingCount > 0 || undurableDraft || draftWriteInFlight);
  }

  function draftDecision(milliseconds) {
    return milliseconds >= DRIVE_CANCEL_CONFIRM_MS ? 'draft' : 'discard';
  }

  function hideVoiceAction({liveSendBeat, handsFree}) {
    if (liveSendBeat) return 'deliver-live-beat';
    if (handsFree) return 'finish-hands-free';
    return 'preserve-recording';
  }

  if (globalThis.C3FeedbackTestShim) {
    globalThis.c3FeedbackTest = {feedbackFor, feedbackKinds, noticeShouldSpeak, cancelDecision, unsentWork, draftDecision, hideVoiceAction};
  }

  const messages = document.getElementById('messages');

  function tableSpeechLine(line) {
    if (!line.includes('|')) return null;
    const cells = line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(cell => cell.trim());
    if (cells.length < 2) return null;
    if (cells.every(cell => /^:?-{3,}:?$/.test(cell.replace(/\s/g, '')))) return '';
    return cells.filter(Boolean).join(', ') + '.';
  }

  // This mirrors the bundled TTS plugin's Markdown-to-speech preprocessing.
  function toSpeakableText(text) {
    if (!text) return '';
    let value = String(text).replace(/\r\n?/g, '\n');
    value = value.replace(/(^|\n)[ \t]*(```|~~~)[\s\S]*?\n?[ \t]*\2(?=\n|$)/g, (_, prefix) => prefix + 'code omitted.\n');
    value = value.replace(/!?\[([^\]]+)\]\([^)]*\)/g, '$1');
    value = value.replace(/(?:https?:\/\/|www\.)[^\s<>]+/gi, 'a link');
    value = value.replace(/(`+)([\s\S]*?)\1/g, '$2');
    const lines = [];
    value.split('\n').forEach(raw => {
      let line = raw.replace(/^[ \t]*#{1,6}[ \t]+/, '').replace(/^[ \t]*(?:>[ \t]*)+/, '');
      const bullet = line.match(/^[ \t]*(?:[-+*]|\d+[.)])[ \t]+(.*)$/);
      if (bullet) {
        line = bullet[1].trim();
        if (line && !/[.!?।]$/.test(line)) line += '.';
      }
      const table = tableSpeechLine(line);
      if (table !== null) line = table;
      if (line) lines.push(line);
    });
    value = lines.join('\n').replace(/\*\*|__|~~/g, '').replace(/[\*_]/g, '');
    value = value.replace(/📨|⏸|⚠️/g, '');
    value = value.replace(/[\u{1F000}-\u{1FAFF}\u2600-\u27BF\uFE0F\u200D]/gu, '');
    value = value.replace(/\s+/g, ' ').trim();
    return /[\p{L}\p{N}]/u.test(value) ? value : '';
  }

  function updateDriveReply(text, messageID, attachmentValue) {

    if (nextMessageID && newestAgentReplyID && nextMessageID < newestAgentReplyID) return;

    const value = String(path || '');
    return value
      .replace(/^\/home\/[^/]+(?=\/|$)/, '~')
      .replace(/^\/Users\/[^/]+(?=\/|$)/, '~')
      .replace(/^[A-Za-z]:\\Users\\[^\\]+(?=\\|$)/, '~');
  }

  function middleEllipsis(value, limit) {
    const text = String(value || '');
    if (text.length <= limit) return text;
    const left = Math.ceil((limit - 1) / 2);
    const right = Math.floor((limit - 1) / 2);
    return text.slice(0, left) + '…' + text.slice(text.length - right);
  }

  function presenceShortText() {
    if (!presenceKnown) return connectionText;
    if (!presence.attached) return '○ no session';
    const parts = [];
    if (presence.cli) parts.push(presence.cli);
    if (presence.cwd) parts.push(middleEllipsis(shortenHome(presence.cwd), 28));
    return parts.length ? '● ' + parts.join(' · ') : '● connected';
  }

  function presenceSignature(data) {
    return [Boolean(data.attached), data.cli || '', data.cwd || '', Number(data.pid || 0), data.session_id || '', data.since || ''].join('\u0000');
  }

  function openDriveDraftDatabase() {
    return new Promise((resolve, reject) => {
      if (!window.indexedDB) {
        reject(new Error('draft storage unavailable'));
        return;
      }
      const request = window.indexedDB.open(DRIVE_DRAFT_DATABASE_NAME, 1);
      request.addEventListener('upgradeneeded', () => {
        const database = request.result;
        if (!database.objectStoreNames.contains(DRIVE_DRAFT_STORE_NAME)) {
          database.createObjectStore(DRIVE_DRAFT_STORE_NAME, {keyPath: 'slot'});
        }
      });
      request.addEventListener('success', () => {
        const database = request.result;
        database.addEventListener('versionchange', () => database.close());
        resolve(database);
      });
      request.addEventListener('error', () => reject(request.error || new Error('draft storage failed')));
      request.addEventListener('blocked', () => reject(new Error('draft storage blocked')));
    });
  }

  async function readStoredDriveDraft() {
    const database = await openDriveDraftDatabase();
    try {
      return await new Promise((resolve, reject) => {
        const transaction = database.transaction(DRIVE_DRAFT_STORE_NAME, 'readonly');
        const request = transaction.objectStore(DRIVE_DRAFT_STORE_NAME).get(DRIVE_DRAFT_SLOT);
        request.addEventListener('success', () => resolve(request.result || null));
        request.addEventListener('error', () => reject(request.error || new Error('draft read failed')));
      });
    } finally {
      database.close();
    }
  }

  async function writeStoredDriveDraft(draft) {
    const database = await openDriveDraftDatabase();
    try {
      await new Promise((resolve, reject) => {
        const transaction = database.transaction(DRIVE_DRAFT_STORE_NAME, 'readwrite');
        transaction.objectStore(DRIVE_DRAFT_STORE_NAME).put({
          slot: DRIVE_DRAFT_SLOT,
          blob: draft.blob,
          mimeType: draft.mimeType,
          duration: draft.duration,
          clientID: draft.clientID,
          source: draft.source
        });
        transaction.addEventListener('complete', resolve);
        transaction.addEventListener('abort', () => reject(transaction.error || new Error('draft write aborted')));
        transaction.addEventListener('error', () => reject(transaction.error || new Error('draft write failed')));
      });
    } finally {
      database.close();
    }
  }

  async function deleteStoredDriveDraft() {
    const database = await openDriveDraftDatabase();
    try {
      await new Promise((resolve, reject) => {
        const transaction = database.transaction(DRIVE_DRAFT_STORE_NAME, 'readwrite');
        transaction.objectStore(DRIVE_DRAFT_STORE_NAME).delete(DRIVE_DRAFT_SLOT);
        transaction.addEventListener('complete', resolve);
        transaction.addEventListener('abort', () => reject(transaction.error || new Error('draft delete aborted')));
        transaction.addEventListener('error', () => reject(transaction.error || new Error('draft delete failed')));
      });
    } finally {
      database.close();
    }
  }

  function announceDraftFound() {

  function renderDriveDraftOffer() {
    const hidden = !driveDraft;

    const seconds = Math.max(1, Math.round(Number(driveDraft.duration || 0)));
    driveDraftResend.textContent = '⤴ Resend draft (' + seconds + 's)';
    chatDraftResend.textContent = '⤴ Resend draft (' + seconds + 's)';
    announceDraftFound();

  async function keepDriveDraft(draft, announce) {
    driveDraft = draft;
    driveDraftDurable = false;
    draftFoundAnnounced = true;
    renderDriveDraftOffer();
    driveDraftWriteInFlight += 1;
    try {
      await writeStoredDriveDraft(draft);
      if (driveDraft === draft) driveDraftDurable = true;
      if (announce) localNotice('draft-saved');
    } catch (error) {
      showDriveTranscriptNotice('could not save draft', 4000);
      localNotice('error');
      console.error('web: drive draft save failed', error);
    } finally {
      driveDraftWriteInFlight -= 1;
    }
  }

  async function loadDriveDraft() {
    try {
      const draft = await readStoredDriveDraft();
      if (!draft || !(draft.blob instanceof Blob) || !draft.blob.size) return;
      driveDraft = {
        blob: draft.blob,
        mimeType: String(draft.mimeType || draft.blob.type || 'audio/webm'),
        duration: Math.max(0, Number(draft.duration || 0)),
        clientID: String(draft.clientID || clientID()),
        source: draft.source === 'chat' ? 'chat' : 'drive'
      };
      driveDraftDurable = true;
      draftFoundAnnounced = false;
      renderDriveDraftOffer();
    } catch (error) {
      console.error('web: drive draft load failed', error);
    }
  }

  function discardDriveDraft() {
    if (!driveDraft) return;
    driveDraft = null;
    driveDraftDurable = false;
    renderDriveDraftOffer();
    deleteStoredDriveDraft().catch(() => {});
    localNotice('recording-cancelled');
  }

  function resendDriveDraft() {
    if (!driveDraft) return;
    const draft = driveDraft;
    driveDraft = null;
    driveDraftDurable = false;
    renderDriveDraftOffer();
    const row = addMessage('mine', {
      voice: true,
      duration_seconds: draft.duration,
      timestamp: new Date().toISOString()
    }, 'sending', {forceScroll: true});
    pendingRows.set(draft.clientID, row);
    const drive = draft.source === 'drive';
    if (drive) {
      resetReplyTracking();
      awaitingClientID = draft.clientID;
      setState('sending', true);
      localNotice('sending');
    }
    deliverVoice({
      blob: draft.blob,
      mimeType: draft.mimeType,
      clientID: draft.clientID,
      row,
      attempt: 0,
      drive,
      fromDraft: draft
    });
  }

  function scrollBottom() {
