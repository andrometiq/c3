name: release

# Cut a GitHub release with prebuilt C3 binaries whenever a v* tag is pushed.
# Pure-Go cross-compile (CGO disabled) builds every OS/arch on one Linux runner,
# so no macOS runners and no artifact hand-off between jobs are needed.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # required to create the release and upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod # tracks the go directive in go.mod, no drift
          cache: true

      - name: Verify module and build
        run: |
          go mod verify
          go build ./...

      - name: Build release tarballs
        run: make dist VERSION="${GITHUB_REF_NAME}"

      - name: Verify complete release set
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"
          set -- \
            "dist/c3_${TAG}_linux_amd64.tar.gz" \
            "dist/c3_${TAG}_linux_arm64.tar.gz" \
            "dist/c3_${TAG}_darwin_amd64.tar.gz" \
            "dist/c3_${TAG}_darwin_arm64.tar.gz" \
            "dist/c3_${TAG}_windows_amd64.tar.gz" \
            "dist/c3_${TAG}_windows_arm64.tar.gz"
          [ "$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 6 ]
          for archive in "$@"; do
            [ -f "$archive" ]
          done
          [ -f dist/SHA256SUMS ]
          expected_names="$(printf '%s\n' "$@" | sed 's#^dist/##' | LC_ALL=C sort)"
          actual_names="$(awk 'NF {print $2}' dist/SHA256SUMS | LC_ALL=C sort)"
          [ "$(awk 'NF {n++} END {print n+0}' dist/SHA256SUMS)" -eq 6 ]
          [ "$actual_names" = "$expected_names" ]
          (cd dist && sha256sum -c SHA256SUMS)
          ls -l dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          notes_flags="--generate-notes"
          case "$TAG" in
            *-*) prerelease="--prerelease" ;; # v1.0.0-rc1 etc. → prerelease
            *)   prerelease="" ;;
          esac
          set -- \
            "dist/c3_${TAG}_linux_amd64.tar.gz" \
            "dist/c3_${TAG}_linux_arm64.tar.gz" \
            "dist/c3_${TAG}_darwin_amd64.tar.gz" \
            "dist/c3_${TAG}_darwin_arm64.tar.gz" \
            "dist/c3_${TAG}_windows_amd64.tar.gz" \
            "dist/c3_${TAG}_windows_arm64.tar.gz"
          gh release create "$TAG" "$@" dist/SHA256SUMS \
            --title "$TAG" \
            --verify-tag \
            $notes_flags $prerelease
