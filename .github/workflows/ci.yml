name: ci

# Cheap sanity gate: build, vet, and test on every push and PR to master.
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      # The same gate runs from .githooks/pre-commit. Keeping the command list
      # in one script prevents local checks and hosted CI from drifting apart.
      - name: Commit gate
        run: make ci
